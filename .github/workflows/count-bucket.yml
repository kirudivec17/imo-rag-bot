name: Count Bucket
on:
  workflow_dispatch:
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
            - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH
            - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
            - name: Count Objects
        run: |
          echo "=== imo_pdfs ==="
          oci os object list -ns ${{ secrets.OCI_NAMESPACE }} -bn ${{ secrets.OCI_BUCKET }} --prefix imo_pdfs/ --all --query "length(data.objects)" 
          echo "=== imo_pdfs_2 ==="
          oci os object list -ns ${{ secrets.OCI_NAMESPACE }} -bn ${{ secrets.OCI_BUCKET }} --prefix imo_pdfs_2/ --all --query "length(data.objects)"
          echo "=== imo_pdfs_3 ==="
          oci os object list -ns ${{ secrets.OCI_NAMESPACE }} -bn ${{ secrets.OCI_BUCKET }} --prefix imo_pdfs_3/ --all --query "length(data.objects)"
          echo "=== TOTAL ==="
          oci os object list -ns ${{ secrets.OCI_NAMESPACE }} -bn ${{ secrets.OCI_BUCKET }} --all --query "length(data.objects)"
