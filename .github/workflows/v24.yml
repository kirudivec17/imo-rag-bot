name: V27 Final Push 50 Credits
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v27:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: Fill Folder 2 V27
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python3 << 'PY'
          import os, re, requests, json, time, hashlib, random, urllib.parse
          SERPER_KEY=os.getenv("SERPER_API_KEY")
          os.makedirs("imo_pdfs_2", exist_ok=True); os.makedirs("imo_pdfs", exist_ok=True)
          existing_hashes=set(); existing_names=set()
          for folder in ["imo_pdfs", "imo_pdfs_2"]:
            for f in os.listdir(folder):
              existing_names.add(f.lower())
              try:
                with open(os.path.join(folder,f),"rb") as fh:
                  existing_hashes.add(hashlib.md5(fh.read(20000)).hexdigest())
              except: pass
          before1=len(os.listdir("imo_pdfs")); before2=len(os.listdir("imo_pdfs_2"))
          print(f"Before: {before1}+{before2}={before1+before2}")
          sess=requests.Session(); all_urls=set()
          queries=[
            "site:imo.org filetype:pdf SOLAS amendment 2024 2025",
            "site:imo.org filetype:pdf MARPOL Annex I II III IV V VI",
            "filetype:pdf imo.org COLREG Load Line",
            "site:imo.org filetype:pdf STCW Manila Convention",
            "filetype:pdf imo.org ISPS ISM Code",
            "site:imo.org filetype:pdf Tonnage CSC MODU",
            "filetype:pdf imo.org IMSBC IGC IBC Code",
            "site:imo.org filetype:pdf Casualty III Code audit",
            "filetype:pdf imo.org Polar IGF FSS FTP LSA GMDSS",
            "filetype:pdf imo.org FAL Convention Facilitation",
          ]
          calls=0
          for q in queries:
            for page in range(1,6):
              calls+=1
              try:
                payload=json.dumps({"q":q,"page":page,"num":10})
                headers={"X-API-KEY":SERPER_KEY,"Content-Type":"application/json"}
                r=requests.post("https://google.serper.dev/search", headers=headers, data=payload, timeout=20)
                for item in r.json().get("organic",[]):
                  link=item.get("link","").split("?")[0]
                  if ".pdf" in link.lower(): all_urls.add(link)
                print(f"[{calls}/50] {q[:30]} -> pool {len(all_urls)}")
                time.sleep(0.3)
              except: pass
          print(f"Total pool: {len(all_urls)}")
          def dl(url):
            try:
              fn=re.sub(r'[^A-Za-z0-9._() -]','_', urllib.parse.unquote(url.split("/")[-1]))
              if len(fn)<5: return "SKIP"
              if not fn.lower().endswith(".pdf"): fn+=".pdf"
              if fn.lower() in existing_names: return "SKIP_NAME"
              rr=sess.get(url, timeout=40)
              if rr.status_code==200 and len(rr.content)>15000 and b"%PDF" in rr.content[:8000]:
                h=hashlib.md5(rr.content[:20000]).hexdigest()
                if h in existing_hashes: return "DUP"
                open(f"imo_pdfs_2/{fn}","wb").write(rr.content)
                existing_hashes.add(h); existing_names.add(fn.lower())
                return f"REAL OK {fn}"
            except: return "FAIL"
            return "FAIL"
          from concurrent.futures import ThreadPoolExecutor
          urls=list(all_urls); random.shuffle(urls)
          with ThreadPoolExecutor(max_workers=8) as ex:
            for m in ex.map(dl, urls):
              if "REAL OK" in m: print(m)
          after1=len(os.listdir("imo_pdfs")); after2=len(os.listdir("imo_pdfs_2"))
          print(f"\n=== FINAL === imo_pdfs={after1} imo_pdfs_2={after2} Total={after1+after2} Added={after2-before2} Credits {calls}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/
          git commit -m "V27" || true
          git push
