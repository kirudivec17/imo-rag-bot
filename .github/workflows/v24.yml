name: V28 3-Folder 1900 Credits
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v28:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: Fill 3 Folders
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python3 << 'PY'
          import os, re, requests, json, time, hashlib, random, urllib.parse
          SERPER_KEY=os.getenv("SERPER_API_KEY")
          for d in ["imo_pdfs","imo_pdfs_2","imo_pdfs_3"]:
            os.makedirs(d, exist_ok=True)
          existing_hashes=set(); existing_names=set()
          for folder in ["imo_pdfs","imo_pdfs_2","imo_pdfs_3"]:
            for f in os.listdir(folder):
              existing_names.add(f.lower())
              try:
                with open(os.path.join(folder,f),"rb") as fh:
                  existing_hashes.add(hashlib.md5(fh.read(20000)).hexdigest())
              except: pass
          before = sum(len(os.listdir(d)) for d in ["imo_pdfs","imo_pdfs_2","imo_pdfs_3"])
          print(f"Before Total: {before} | 1:{len(os.listdir('imo_pdfs'))} 2:{len(os.listdir('imo_pdfs_2'))} 3:{len(os.listdir('imo_pdfs_3'))}")
          sess=requests.Session(); all_urls=set()
          queries=[
            "filetype:pdf DNV GL IMO regulation SOLAS MARPOL",
            "filetype:pdf ClassNK IMO requirements",
            "filetype:pdf Lloyd's Register IMO conventions",
            "filetype:pdf ABS American Bureau Shipping IMO",
            "filetype:pdf BIMCO IMO Hong Kong Convention recycling",
            "filetype:pdf IMO carriage requirements publications carriage",
            "filetype:pdf Ballast Water Management IMO guidelines",
            "filetype:pdf Cybersecurity maritime IMO 2024",
            "filetype:pdf Polar Code IMO DNV GL",
            "filetype:pdf Ship recycling Hong Kong Convention 2025",
          ]
          calls=0
          for q in queries:
            for page in range(1,6):
              calls+=1
              try:
                payload=json.dumps({"q":q,"page":page,"num":10})
                headers={"X-API-KEY":SERPER_KEY,"Content-Type":"application/json"}
                r=requests.post("https://google.serper.dev/search", headers=headers, data=payload, timeout=20)
                for item in r.json().get("organic",[]):
                  link=item.get("link","").split("?")[0]
                  if ".pdf" in link.lower(): all_urls.add(link)
                print(f"[{calls}/50] pool {len(all_urls)}")
                time.sleep(0.3)
              except: pass
          print(f"Total pool: {len(all_urls)} Existing: {len(existing_names)}")
          def dl(url):
            try:
              fn=re.sub(r'[^A-Za-z0-9._() -]','_', urllib.parse.unquote(url.split("/")[-1]))
              if len(fn)<5: return "SKIP"
              if not fn.lower().endswith(".pdf"): fn+=".pdf"
              if fn.lower() in existing_names: return "SKIP_NAME"
              rr=sess.get(url, timeout=40)
              if rr.status_code==200 and len(rr.content)>15000 and b"%PDF" in rr.content[:8000]:
                h=hashlib.md5(rr.content[:20000]).hexdigest()
                if h in existing_hashes: return "DUP"
                open(f"imo_pdfs_3/{fn}","wb").write(rr.content)
                existing_hashes.add(h); existing_names.add(fn.lower())
                return f"REAL OK {fn}"
            except: return "FAIL"
            return "FAIL"
          from concurrent.futures import ThreadPoolExecutor
          urls=list(all_urls); random.shuffle(urls)
          with ThreadPoolExecutor(max_workers=8) as ex:
            for m in ex.map(dl, urls):
              if "REAL OK" in m: print(m)
          after = sum(len(os.listdir(d)) for d in ["imo_pdfs","imo_pdfs_2","imo_pdfs_3"])
          print(f"\n=== FINAL === 1:{len(os.listdir('imo_pdfs'))} 2:{len(os.listdir('imo_pdfs_2'))} 3:{len(os.listdir('imo_pdfs_3'))} Total={after} Added={after-before} Credits {calls}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/ imo_pdfs_3/
          git commit -m "V28 3-folder" || true
          git push
