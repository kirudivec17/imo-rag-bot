name: Rebalance to 995
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance 995/995/3
        run: |
          python3 << 'PY'
          import os, shutil, random
          os.makedirs("imo_pdfs", exist_ok=True)
          os.makedirs("imo_pdfs_2", exist_ok=True)
          os.makedirs("imo_pdfs_3", exist_ok=True)
          
          all_files=[]
          for folder in ["imo_pdfs","imo_pdfs_2","imo_pdfs_3"]:
            if os.path.exists(folder):
              for f in os.listdir(folder):
                all_files.append(os.path.join(folder,f))
          
          # unique
          all_files=list(set(all_files))
          print(f"Total before: {len(all_files)}")
          
          random.shuffle(all_files)
          
          # target
          targets = {
            "imo_pdfs": 995,
            "imo_pdfs_2": 995,
            "imo_pdfs_3": 9999
          }
          
          # clear and refill
          # move all to temp
          os.makedirs("temp_all", exist_ok=True)
          for p in all_files:
            try:
              shutil.move(p, os.path.join("temp_all", os.path.basename(p)))
            except: pass
          
          files = os.listdir("temp_all")
          print(f"Temp: {len(files)}")
          
          idx=0
          for folder, limit in [("imo_pdfs",995), ("imo_pdfs_2",995), ("imo_pdfs_3",99999)]:
            count=0
            os.makedirs(folder, exist_ok=True)
            # clean folder first
            for f in os.listdir(folder):
              try: os.remove(os.path.join(folder,f))
              except: pass
            while idx < len(files) and count < limit:
              src = os.path.join("temp_all", files[idx])
              dst = os.path.join(folder, files[idx])
              shutil.move(src, dst)
              idx+=1
              count+=1
            print(f"{folder}: {count}")
          
          print(f"After: imo_pdfs={len(os.listdir('imo_pdfs'))} imo_pdfs_2={len(os.listdir('imo_pdfs_2'))} imo_pdfs_3={len(os.listdir('imo_pdfs_3'))} Total={len(os.listdir('imo_pdfs'))+len(os.listdir('imo_pdfs_2'))+len(os.listdir('imo_pdfs_3'))}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/ imo_pdfs_3/
          git rm -r --cached temp_all || true
          rm -rf temp_all || true
          git commit -m "Rebalance 995/995/3" || true
          git push
