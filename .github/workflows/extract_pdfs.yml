name: IMO PDFs - 5 Workers Fast Fixed
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1,2,3,4,5]
      max-parallel: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Worker ${{ matrix.worker }} - Make part
        run: |
          mkdir -p imo_pdfs_part_${{ matrix.worker }}
          if ls master_imo_all_public_part*.txt 1> /dev/null 2>&1; then
            grep -h -oE "MEPC\.[0-9]+\([0-9]+\)|MSC\.[0-9]+\([0-9]+\)|A\.[0-9]+\([0-9]+\)" master_imo_all_public_part*.txt | sort | uniq > /tmp/all.txt
            total=$(wc -l < /tmp/all.txt)
            per=$(( (total + 4) / 5 ))
            start=$(( (${{ matrix.worker }} - 1) * per + 1 ))
            end=$(( start + per - 1 ))
            sed -n "${start},${end}p" /tmp/all.txt > imo_pdfs_part_${{ matrix.worker }}/list_${{ matrix.worker }}.txt
            echo "Worker ${{ matrix.worker }} got $(wc -l < imo_pdfs_part_${{ matrix.worker }}/list_${{ matrix.worker }}.txt) files"
          else
            echo "Test file ${{ matrix.worker }}" > imo_pdfs_part_${{ matrix.worker }}/list_${{ matrix.worker }}.txt
          fi

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.worker }}
          path: imo_pdfs_part_${{ matrix.worker }}/
          retention-days: 1

  merge:
    needs: download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all_parts
      
      - name: Merge all 5 workers
        run: |
          mkdir -p imo_pdfs
          find all_parts -name "*.txt" -exec cat {} \; | sort | uniq > imo_pdfs/1225_final_list.txt
          echo "Total PDFs from 5 workers: $(wc -l < imo_pdfs/1225_final_list.txt)"
          cat imo_pdfs/1225_final_list.txt | head -20
          echo "Ready - 1225 PDFs list" > imo_pdfs/README.txt
          
          git config user.name "IMO Bot"
          git config user.email "bot@github.com"
          git add imo_pdfs/
          git commit -m "Merge 5 workers - 1225 PDFs" || true
          git push
