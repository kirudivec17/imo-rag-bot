name: Auto - RESUME - 100-100 Karke 2400 Tak

on:
  workflow_dispatch:
    inputs:
      target_total:
        description: 'Kahan tak jana hai?'
        required: false
        default: '2400'
      batch_size:
        description: 'Har batch me kitne PDF'
        required: false
        default: '100'

permissions:
  contents: write

concurrency:
  group: imo-rag-build
  cancel-in-progress: false

jobs:
  auto-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -q pypdf sentence-transformers numpy

      - name: Auto Loop - Sirf Part Banao, Git Mat Chhedo
        env:
          TARGET_TOTAL: ${{ inputs.target_total }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          cat > auto_loop2.py << 'PYEOF'
          import os, glob, re, time, urllib.parse, traceback
          from pypdf import PdfReader
          from sentence_transformers import SentenceTransformer
          import numpy as np
          TARGET = int(os.environ.get("TARGET_TOTAL","2400"))
          BATCH = int(os.environ.get("BATCH_SIZE","100"))
          model = SentenceTransformer('all-MiniLM-L6-v2')
          pdf_folders = sorted(glob.glob("imo_pdfs*"))
          all_pdfs = sorted(sum([glob.glob(os.path.join(f,"**/*.pdf"), recursive=True) for f in pdf_folders], []))
          print(f"TOTAL PDF: {len(all_pdfs)} | TARGET: {TARGET}")
          batch_no = 1
          while True:
              try:
                  done_pdfs = set()
                  for f in glob.glob("master_imo_all_public_part*.txt"):
                      if "part96" in f: continue
                      with open(f, errors='ignore') as fh:
                          for line in fh:
                              if line.startswith("SOURCE:"):
                                  name = urllib.parse.unquote(line.replace("SOURCE:","").strip())
                                  done_pdfs.add(name)
                  print(f"\n=== BATCH {batch_no} | HO GAYE: {len(done_pdfs)} / {TARGET} ===")
                  if len(done_pdfs) >= TARGET:
                      print("STOP - TARGET PURA!"); break
                  def norm(p): return urllib.parse.unquote(os.path.basename(p))
                  remaining = [p for p in all_pdfs if norm(p) not in done_pdfs]
                  if not remaining:
                      print("STOP - KOI BACHA NAHI"); break
                  batch = remaining[:BATCH]
                  nums = []
                  for f in glob.glob("master_imo_all_public_part*.txt"):
                      m = re.search(r'part(\d+)\.txt', f)
                      if m: nums.append(int(m.group(1)))
                  next_part = max(nums)+1 if nums else 0
                  new_chunks, new_texts = [], []
                  for pdf_path in batch:
                      try:
                          reader = PdfReader(pdf_path)
                          text = "".join([(p.extract_text() or "")+"\n" for p in reader.pages])
                          pdf_name = os.path.basename(pdf_path)
                          for i in range(0, len(text), 800):
                              ct = text[i:i+1000].strip()
                              if len(ct) < 50: continue
                              new_chunks.append(f"SOURCE: {pdf_name}\n{ct}\n---CHUNK---")
                              new_texts.append(ct)
                          print(f"OK: {pdf_name}")
                      except Exception as e:
                          print(f"FAIL PDF SKIP: {pdf_path} - {e}")
                          continue
                  part_file = f"master_imo_all_public_part{next_part}.txt"
                  with open(part_file,"w",encoding="utf-8") as out:
                      out.write("\n".join(new_chunks))
                  print(f"PART BAN GAYA: {part_file} - {len(new_chunks)} chunks")
                  if new_texts:
                      try:
                          embs = model.encode(new_texts, show_progress_bar=False)
                          np.save(f"embeddings_part{next_part}.npy", embs)
                      except Exception as e:
                          print(f"EMB SKIP: {e}")
                  old_total = 12002
                  try:
                      for line in open("imo_public_summary.txt"):
                          if "Total Chunks" in line: old_total = int(line.split(":")[1].strip())
                  except: pass
                  with open("imo_public_summary.txt","w") as out:
                      out.write(f"Total Unique PDFs: {len(done_pdfs)+len(batch)}\n")
                      out.write(f"Total Chunks: {old_total+len(new_chunks)}\n")
                      out.write(f"Total Parts: {next_part+1}\n")
                      out.write(f"Last Batch: Auto Batch {batch_no} - part{next_part}\n")
                  print(f"DONE BATCH {batch_no}: PDFs {len(done_pdfs)+len(batch)}")
                  batch_no += 1
                  if len(done_pdfs)+len(batch) >= TARGET:
                      print("STOP - TARGET PURA!"); break
                  print("10 SEC RUK..."); time.sleep(10)
              except Exception as e:
                  print(f"BATCH ERROR, AGLE BATCH PE JA RAHE: {e}")
                  traceback.print_exc()
                  time.sleep(10)
                  continue
          print(f"FINAL: Batches = {batch_no-1}")
          PYEOF
          python3 auto_loop2.py

      - name: Push Sab Parts - Agar Fail Bhi Hua To Bhi Push Karo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add master_imo_all_public_part*.txt imo_public_summary.txt embeddings_part*.npy || true
          git commit -m "Auto Resume - remaining batches" || echo "nothing to commit"
          git pull --rebase || true
          git push || git push --force-with-lease || echo "PUSH FAIL - parts local me bache hai, dobara run karo"
