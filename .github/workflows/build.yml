name: Free SOLAS CDN Circulars
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf langchain-text-splitters --quiet
      - name: Download Free CDN Circulars
        run: |
          python - << 'PY'
          import re, glob, requests, urllib.parse, concurrent.futures, os
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter

          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})

          splitter=RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)
          
          existing=set(); max_part=-1
          for fn in glob.glob('imo-rag-bot/master_imo_all_public_part*.txt'):
              try:
                  t=open(fn,encoding='utf-8',errors='ignore').read()
                  existing.update(re.findall(r'SOURCE:\s*([^\n]+\.pdf)', t))
                  m=re.search(r'part(\d+)\.txt',fn)
                  if m: max_part=max(max_part,int(m.group(1)))
              except: pass
          print(f"Existing: {len(existing)} PDFs, max_part: {max_part}")

          # Ye wale FREE CDN pe hote hain - docs.imo.org pe paid hain
          base_urls=[]
          for n in range(1000, 1700):
              base_urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/Documents/MSC.1-Circ.{n}.pdf")
              base_urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/Documents/MEPC.1-Circ.{n}.pdf")
              base_urls.append(f"https://www.imo.org/en/OurWork/Circulars/Documents/MSC.1-Circ.{n}.pdf")
              base_urls.append(f"https://docs.imo.org/Documents/Circulars/MSC.1/Circ.{n}.pdf")
          
          # SOLAS ke famous free circulars jo 100% free hain
          famous=[
            "https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/LSA%20Code.pdf",
            "https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/FSS%20Code.pdf",
            "https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/ISM%20Code.pdf",
            "https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/ISPS%20Code.pdf",
          ]
          base_urls = famous + base_urls
          
          # Filter already done
          todo=[]
          for u in base_urls:
              fname=urllib.parse.unquote(u.split('/')[-1])
              if fname not in existing:
                  todo.append(u)
          
          import random; random.shuffle(todo)
          todo=todo[:3000]
          print(f"To Try: {len(todo)}")

          def dl(url):
              try:
                  r=s.get(url, timeout=25)
                  if r.status_code!=200: return None
                  if len(r.content)<5000: return None
                  if b'%PDF' not in r.content[:1000]: return None
                  open('/tmp/t.pdf','wb').write(r.content)
                  try:
                      pages=PdfReader('/tmp/t.pdf').pages
                  except: return None
                  txt="".join([(p.extract_text() or "") for p in pages])
                  if len(txt)<500: return None
                  fname=urllib.parse.unquote(url.split('/')[-1].split('?')[0])
                  if fname in existing: return None
                  chunks=splitter.split_text(txt)
                  out="".join([f"SOURCE: {fname}\nURL: {url}\n{c}\n---\n" for c in chunks])
                  return (fname,out)
              except Exception as e:
                  return None

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              futures=[ex.submit(dl,u) for u in todo]
              for f in concurrent.futures.as_completed(futures):
                  r=f.result()
                  if r:
                      results.append(r)
                      print(f"[{len(results)}] OK {r[0]}")
                      if len(results)>=70: # 50-60 ka target
                          break

          print(f"FINAL NEW: {len(results)}")
          if results:
              os.makedirs("imo-rag-bot", exist_ok=True)
              combined="\n".join([x[1] for x in results])
              nxt=max_part+1
              open(f"imo-rag-bot/master_imo_all_public_part{nxt}.txt",'w',encoding='utf-8').write(combined)
              total_chunks=sum([open(fn,encoding='utf-8',errors='ignore').read().count('---') for fn in glob.glob('imo-rag-bot/master_imo_all_public_part*.txt')])
              summ=f"Total Unique PDFs: {len(existing)+len(results)}\nTotal Chunks: {total_chunks}\nTotal Parts: {nxt+1}\nLast Batch: {len(results)} free SOLAS CDN\n"
              print(summ)
              open('imo_public_summary.txt','w').write(summ)
              open('imo-rag-bot/imo_public_summary.txt','w').write(summ)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A
          git commit -m "free solas cdn 50-60" || true
          git push || true
