name: Build 100-100 Continuous IMO
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pypdf langchain-text-splitters requests

      - run: |
          python << 'PY'
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter
          import requests, io, glob, time

          splitter = RecursiveCharacterTextSplitter(chunk_size=1200, chunk_overlap=250)
          sess = requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})

          # 1. LOAD OLD PDFs - REPEAT IGNORE LIST
          existing_sources = set()
          existing_chunks = []
          for f in glob.glob("master_imo_all_public_part*.txt"):
              try:
                  txt = open(f, 'r', encoding='utf-8', errors='ignore').read()
                  if not txt: continue
                  parts = txt.split("\n\n---CHUNK---\n\n")
                  existing_chunks.extend(parts)
                  for p in parts:
                      if p.startswith("SOURCE:"):
                          src = p.split("\n")[0].replace("SOURCE:","").strip()
                          existing_sources.add(src)
              except: pass

          print(f"OLD DATA: {len(existing_sources)} PDFs already done, {len(existing_chunks)} chunks")
          print(f"OLD PDFs: {list(existing_sources)[:5]}")

          # 2. MAKE 2000 URLs LIST
          all_urls = []
          # Important HKC list
          all_urls += [
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.196(62).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.197(62).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.269(68).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.379(80).pdf",
          ]
          for i in range(1, 501):
              for fmt in [f"{i}(62)", f"{i}(63)", f"{i}(68)", f"{i}(80)", f"{i}(76)", f"{i}(83)", f"{i}(32)", f"{i}(33)"]:
                  all_urls.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.{fmt}.pdf")
                  all_urls.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.{fmt}.pdf")
                  all_urls.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions/MSC.{fmt}.pdf")

          all_urls = list(dict.fromkeys(all_urls))
          print(f"TOTAL URLs LIST: {len(all_urls)}")

          # 3. 100-100 SEARCH WITH REPEAT IGNORE
          total_ok = 0
          BATCH_SIZE = 100

          for start in range(0, len(all_urls), BATCH_SIZE):
              batch_urls = all_urls[start:start+BATCH_SIZE]
              print(f"\n--- SEARCHING BATCH {start//BATCH_SIZE + 1} : {start} to {start+BATCH_SIZE-1} ---")
              batch_new = 0

              for url in batch_urls:
                  fname = url.split('/')[-1]
                  if fname in existing_sources:
                      # print(f"SKIP REPEAT {fname}")
                      continue # REPEAT IGNORE

                  try:
                      r = sess.get(url, timeout=25)
                      if r.status_code!= 200 or len(r.content) < 12000:
                          continue
                      reader = PdfReader(io.BytesIO(r.content))
                      text = "".join([p.extract_text() or "" for p in reader.pages])
                      if len(text) < 500:
                          continue

                      # SUCCESS - NEW PDF
                      total_ok += 1
                      batch_new += 1
                      existing_sources.add(fname)
                      for c in splitter.split_text(text):
                          existing_chunks.append(f"SOURCE: {fname}\n{c}")
                      print(f"[NEW] {total_ok} {fname} - Total chunks {len(existing_chunks)}")

                  except Exception as e:
                      continue

              # SAVE AFTER EVERY 100
              if existing_chunks:
                  per = len(existing_chunks)//10 + 1
                  for p in range(10):
                      part = existing_chunks[p*per:(p+1)*per]
                      if not part: continue
                      open(f"master_imo_all_public_part{p+1}.txt",'w',encoding='utf-8').write('\n\n---CHUNK---\n\n'.join(part))

                  open('imo_public_summary.txt','w').write(f"Processed till {start+BATCH_SIZE}\nTotal Unique PDFs: {len(existing_sources)}\nTotal Chunks: {len(existing_chunks)}\nLast Batch New: {batch_new}\n")
                  print(f"SAVED till {start+BATCH_SIZE} - Total PDFs {len(existing_sources)}")

              time.sleep(1) # IMO block se bachne ke liye
              if len(existing_chunks) > 40000:
                  print("Limit 40k reached, stopping")
                  break

          print(f"FINAL DONE: {len(existing_sources)} PDFs, {len(existing_chunks)} chunks")
          PY

      - run: |
          git config user.name "imo-continuous-bot"
          git config user.email "bot@imo.com"
          git add master_imo_all_public_part*.txt imo_public_summary.txt
          git commit -m "continuous 100-100 search with repeat ignore" || true
          git push
