name: Build 2000+ ALL IMO - Phase 3 Circulars
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf langchain-text-splitters --quiet
      - name: Build Circulars Phase 3
        run: |
          python - << 'PY'
          import os, re, concurrent.futures, urllib.parse, requests, glob, random
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/pdf"})
          splitter=RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)

          all_txt=glob.glob('**/master_imo_all_public_part*.txt', recursive=True)
          existing=set(); max_part=-1
          for fn in all_txt:
              try:
                  txt=open(fn, encoding='utf-8', errors='ignore').read()
                  for m in re.findall(r'SOURCE:\s*([^\n]+\.pdf)', txt): existing.add(m.strip())
                  mm=re.search(r'part(\d+)\.txt', fn)
                  if mm: max_part=max(max_part, int(mm.group(1)))
              except: pass
          print(f"Before: {len(existing)} PDFs, max_part={max_part}")

          urls=[]
          # Circulars ke 5 alag patterns IMO pe
          for n in range(1200, 1700):
              # MSC circulars
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC.1-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC.1-Circ.{n}-Rev.1.pdf")
              urls.append(f"https://www.imo.org/localresources/en/OurWork/Circulars/MSC.1-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/Circulars/MSC.1-Circ.{n}.pdf")
              # MEPC circulars
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MEPC.1-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MEPC.1-Circ.{n}-Rev.1.pdf")
              urls.append(f"https://www.imo.org/localresources/en/OurWork/Circulars/MEPC.1-Circ.{n}.pdf")

          for n in range(800, 1200):
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC.1-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC.1-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/Circulars/MSC.1-Circ.{n}.pdf")

          # MSC-MEPC joint circulars
          for n in range(1, 50):
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC-MEPC.2-Circ.{n}.pdf")
              urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Circulars/MSC-MEPC.5-Circ.{n}.pdf")

          random.shuffle(urls)
          new_urls=[u for u in urls if urllib.parse.unquote(u.split('/')[-1]) not in existing][:6000]
          print(f"NEW to try: {len(new_urls)} sample {new_urls[0] if new_urls else ''}")

          def dl(url):
              try:
                  r=s.get(url, timeout=25, allow_redirects=True)
                  if r.status_code!=200: return None
                  if len(r.content)<2000: return None
                  if b'%PDF' not in r.content[:50] and b'PDF' not in r.content[:100]: return None
                  open('/tmp/t.pdf','wb').write(r.content)
                  reader=PdfReader('/tmp/t.pdf')
                  text="".join([(p.extract_text() or "") for p in reader.pages[:4]])
                  if len(text)<100: return None
                  fname=urllib.parse.unquote(url.split('/')[-1])
                  out=""
                  for ch in splitter.split_text(text): out+=f"SOURCE: {fname}\nURL: {url}\n{ch}\n---\n"
                  return (fname,out)
              except: return None

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=60) as ex:
              futs=[ex.submit(dl,u) for u in new_urls]
              for f in concurrent.futures.as_completed(futs):
                  r=f.result()
                  if r:
                      results.append(r)
                      print(f"  [{len(results)}] OK {r[0]}")
                      if len(results)>=100: break
          print(f"FINAL Downloaded: {len(results)}")

          if results:
              combined="\n".join([x[1] for x in results])
              next_file=f"imo-rag-bot/master_imo_all_public_part{max_part+1}.txt"
              os.makedirs("imo-rag-bot", exist_ok=True)
              open(next_file,'w', encoding='utf-8').write(combined)
              # Summary with chunks
              total_chunks=0
              for fn in glob.glob('imo-rag-bot/master_imo_all_public_part*.txt'):
                  try: total_chunks+=open(fn, encoding='utf-8', errors='ignore').read().count('---')
                  except: pass
              total_unique=len(existing)+len(results)
              summary=f"Total Unique PDFs: {total_unique}\nTotal Chunks: {total_chunks}\nLast Batch: {len(results)} PDFs, {sum([r[1].count('---') for r in results])} chunks\n"
              open('imo_public_summary.txt','w').write(summary)
              open('imo-rag-bot/imo_public_summary.txt','w').write(summary)
              print(summary)
          else:
              print(f"FINAL: {len(existing)} PDFs - no new circulars found, try lower numbers")
          PY
      - name: Push all
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A
          git commit -m "phase3 circulars" || true
          git push || true
