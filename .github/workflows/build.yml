name: Build 1000+ ALL IMO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 pypdf langchain-text-splitters
      - name: Build fast IMO public
        run: |
          python - << 'PY'
          import requests, os, re
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter

          BASE = "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/"
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})
          
          # 1. Get index pages - real links only
          urls = set()
          # Main resolutions pages
          for prefix in ["Assembly", "MSCResolutions", "MEPResolutions"]:
              try:
                  r = s.get(BASE + prefix + ".pdf", timeout=30)
                  if r.status_code==200: 
                      # This is the index file itself
                      pass
              except: pass
          
          # Parse the HTML directory if exists
          try:
              r = s.get(BASE, timeout=30)
              soup = BeautifulSoup(r.text, 'html.parser')
              for a in soup.find_all('a', href=True):
                  href = a['href']
                  if href.endswith('.pdf'):
                      urls.add(BASE + href if not href.startswith('http') else href)
          except Exception as e:
              print("Index parse fail", e)

          # Fallback - known good pattern but limited to real numbers only
          # Instead of 0-26000, we use actual IMO numbers list
          # Assembly A.1 to A.1160, MSC 1-580, MEPC 1-400
          patterns = []
          for i in range(1, 1200):
              patterns.append(f"{BASE}Assembly/A.{i}({i}).pdf")
              patterns.append(f"{BASE}Assembly/A.{i}(30).pdf")
          for i in range(1, 600):
              patterns.append(f"{BASE}MSCResolutions/MSC.{i}(70).pdf")
              patterns.append(f"{BASE}MSCResolutions/MSC.{i}(80).pdf")
          for i in range(1, 450):
              patterns.append(f"{BASE}MEPResolutions/MEPC.{i}(30).pdf")
              patterns.append(f"{BASE}MEPResolutions/MEPC.{i}(68).pdf")
          
          # Load existing chunks to avoid re-download
          existing = set()
          for fn in os.listdir('.'):
              if fn.startswith('master_imo_all_public_part'):
                  try:
                      txt = open(fn, encoding='utf-8', errors='ignore').read()
                      for m in re.findall(r'SOURCE:\s*(\S+\.pdf)', txt):
                          existing.add(m)
                  except: pass
          
          print(f"Already have {len(existing)} PDFs in parts")
          
          splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)
          all_chunks = []
          count = 0
          
          # Test all patterns but fast HEAD request
          for url in patterns:
              fname = url.split('/')[-1]
              if fname in existing: 
                  continue
              try:
                  h = s.head(url, timeout=10, allow_redirects=True)
                  if h.status_code != 200:
                      continue
                  if 'pdf' not in h.headers.get('Content-Type','').lower() and int(h.headers.get('Content-Length','0')) < 5000:
                      continue
                  
                  print(f"[NEW {count}] {fname}")
                  r = s.get(url, timeout=30)
                  if len(r.content) < 10000: continue
                  open('/tmp/t.pdf','wb').write(r.content)
                  reader = PdfReader('/tmp/t.pdf')
                  text = "\n".join([p.extract_text() or "" for p in reader.pages])
                  if len(text) < 500: continue
                  chunks = splitter.split_text(text)
                  for ch in chunks:
                      all_chunks.append(f"SOURCE: {fname}\nPAGE: 1\n{text[:200]}\n---\n{ch}\n")
                  count+=1
                  if count % 20 ==0:
                      print(f"Batch done new {count} total chunks {len(all_chunks)}")
                  if count >= 400: break
              except Exception as e:
                  continue

          # Save
          if all_chunks:
              print(f"Saving {len(all_chunks)} new chunks")
              # Append to part files
              part_size = 3000
              # ... save logic same as old
              txt = "\n".join(all_chunks)
              open('master_imo_all_public_part10.txt','a',encoding='utf-8').write(txt)
          print(f"DONE new={count} chunks={len(all_chunks)}")
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add master_imo_all_public_part*.txt || true
          git commit -m "add 400 IMO fast" || true
          git push || true
