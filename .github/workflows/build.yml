name: Build 1000+ ALL IMO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 pypdf langchain-text-splitters lxml
      - name: Build REAL list
        run: |
          python - << 'PY'
          import requests, os, re, concurrent.futures
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter

          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})
          BASE = "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/"

          # 1. REAL directory list lo - yahi 1000+ PDFs deta hai
          print("Fetching directory...")
          r = s.get(BASE, timeout=60)
          soup = BeautifulSoup(r.text, 'lxml')
          all_pdfs = []
          for a in soup.find_all('a', href=True):
              href = a['href']
              if href.lower().endswith('.pdf'):
                  url = href if href.startswith('http') else BASE + href
                  # subfolders bhi check karo
                  all_pdfs.append(url)

          # subfolders: Assembly, MSCResolutions, MEPResolutions etc
          for folder in ["Assembly/", "MSCResolutions/", "MEPResolutions/", "Circulars/"]:
              try:
                  rr = s.get(BASE+folder, timeout=30)
                  ss = BeautifulSoup(rr.text, 'lxml')
                  for a in ss.find_all('a', href=True):
                      if a['href'].lower().endswith('.pdf'):
                          all_pdfs.append(BASE+folder+a['href'])
              except: pass

          all_pdfs = list(set(all_pdfs))
          print(f"TOTAL found in directory: {len(all_pdfs)} PDFs")

          # 2. Already downloaded ka list
          existing = set()
          for fn in os.listdir('.'):
              if 'master_imo_all_public_part' in fn:
                  try:
                      txt = open(fn, encoding='utf-8', errors='ignore').read()
                      for m in re.findall(r'SOURCE:\s*([^\s\n]+\.pdf)', txt):
                          existing.add(m)
                  except: pass
          print(f"Already have: {len(existing)}")

          # 3. Filter new only
          new_urls = [u for u in all_pdfs if u.split('/')[-1] not in existing]
          print(f"To download NEW: {len(new_urls)}")

          splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)

          def process(url):
              try:
                  fname = url.split('/')[-1]
                  rr = s.get(url, timeout=60)
                  if len(rr.content) < 8000: return None
                  open('/tmp/t.pdf','wb').write(rr.content)
                  reader = PdfReader('/tmp/t.pdf')
                  text = "\n".join([p.extract_text() or "" for p in reader.pages[:15]])
                  if len(text) < 500: return None
                  chunks = splitter.split_text(text)
                  out = ""
                  for ch in chunks:
                      out += f"SOURCE: {fname}\nURL: {url}\n{ch}\n---\n"
                  return (fname, out)
              except Exception as e:
                  return None

          results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=15) as ex:
              futures = [ex.submit(process, u) for u in new_urls[:600]]
              for f in concurrent.futures.as_completed(futures):
                  res = f.result()
                  if res:
                      results.append(res)
                      if len(results) % 20 == 0:
                          print(f"Downloaded {len(results)}/{len(new_urls)}")

          # 4. Save in batches of 400 PDFs per part file
          if results:
              combined = "\n".join([r[1] for r in results])
              # find next part number
              max_part = 9
              for fn in os.listdir('.'):
                  m = re.match(r'master_imo_all_public_part(\d+)\.txt', fn)
                  if m: max_part = max(max_part, int(m.group(1)))
              next_file = f'master_imo_all_public_part{max_part+1}.txt'
              print(f"Saving {len(results)} PDFs to {next_file} -> {len(combined)} chars")
              open(next_file, 'w', encoding='utf-8').write(combined)
          else:
              print("NO NEW FILES - check logs above")
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add master_imo_all_public_part*.txt || true
          git commit -m "add 300-500 real IMO PDFs" || true
          git push || true
