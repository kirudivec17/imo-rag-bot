name: Build 1000+ ALL IMO
on: workflow_dispatch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pypdf langchain-text-splitters beautifulsoup4 lxml --quiet
      
      - name: Build ALL IMO - Full Capture
        run: |
          python - << 'PY'
          import requests, os, re, concurrent.futures, urllib.parse
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter

          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 Chrome/120"})

          # Existing check - REPEAT ROKO
          existing = set()
          for fn in os.listdir('.'):
            if 'master_imo_all_public_part' in fn:
              try:
                txt = open(fn, encoding='utf-8', errors='ignore').read()
                for m in re.findall(r'SOURCE:\s*([^\s\n]+\.pdf)', txt):
                  existing.add(urllib.parse.unquote(m.strip()))
                  existing.add(m.strip())
              except: pass
          print(f"Already have: {len(existing)} PDFs")

          all_pdfs = set()

          # METHOD 1: IMO ki official index page se saare pdf links nikalo
          try:
            print("Scraping IMO Index page...")
            r = s.get("https://www.imo.org/en/KnowledgeCentre/IndexofIMOResolutions/Pages/Default.aspx", timeout=60)
            soup = BeautifulSoup(r.text, 'lxml')
            for a in soup.find_all('a', href=True):
              href = a['href']
              if '.pdf' in href.lower():
                if href.startswith('http'):
                  all_pdfs.add(href)
                elif href.startswith('/'):
                  all_pdfs.add("https://www.imo.org" + href)
                elif 'localresources' in href:
                  all_pdfs.add("https://wwwcdn.imo.org" + href if href.startswith('/') else "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/" + href
            print(f"From IMO page: {len(all_pdfs)} PDFs")
          except Exception as e:
            print(f"Page scrape error: {e}")

          # METHOD 2: Direct CDN folders scrape (jo tumhare screenshot me fail hua tha)
          bases = [
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/LCLPDocuments/",
          ]
          for base in bases:
            try:
              rr = s.get(base, timeout=30)
              if 'href' in rr.text.lower():
                ss = BeautifulSoup(rr.text, 'lxml')
                for a in ss.find_all('a', href=True):
                  h = a['href']
                  if h.lower().endswith('.pdf'):
                    full = h if h.startswith('http') else base + h
                    all_pdfs.add(full)
            except: pass
          print(f"After folder scrape: {len(all_pdfs)} total unique PDFs")

          # METHOD 3: Known working patterns jo search se mile (LC-LP.1 etc)
          known = [
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/LCLPDocuments/LC-LP.1%20(2008).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/LCLPDocuments/LC-LP.2(2010).pdf",
          ]
          # Assembly real files: A 30-Res.1119 etc jo search me mila
          for n in range(1000, 1230):
            for sess in [30,31,32,33,34]:
              known.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{n}%20({sess}).pdf")
              known.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/Resolution%20A.{n}({sess}).pdf")
              known.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{sess}-Res.{n}.pdf")
              known.append(f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{sess}-Res.{n}.docx")

          all_pdfs.update(known)
          print(f"Final list to try: {len(all_pdfs)} URLs")

          new_urls = [u for u in all_pdfs if urllib.parse.unquote(u.split('/')[-1]) not in existing and u.split('/')[-1] not in existing]
          print(f"NEW after removing existing: {len(new_urls)}")
          new_urls = new_urls[:1500]

          splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)

          def dl(url):
            try:
              r = s.get(url, timeout=25)
              if r.status_code != 200: return None
              if len(r.content) < 10000: return None
              if not r.content[:4] == b'%PDF' and not r.content[:2] == b'PK': # docx bhi
                if b'%PDF' not in r.content[:2000]: return None
              # try pdf
              try:
                open('/tmp/t.pdf','wb').write(r.content)
                reader = PdfReader('/tmp/t.pdf')
                text = ""
                for pg in reader.pages[:20]:
                  text += (pg.extract_text() or "") + "\n"
                if len(text) < 400: return None
              except:
                return None
              fname = urllib.parse.unquote(url.split('/')[-1])
              chunks = splitter.split_text(text)
              out = ""
              for ch in chunks:
                out += f"SOURCE: {fname}\nURL: {url}\n{ch}\n---\n"
              return (fname, out)
            except: return None

          results = []
          print("Downloading 20 workers...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            futs = [ex.submit(dl, u) for u in new_urls]
            for f in concurrent.futures.as_completed(futs):
              rr = f.result()
              if rr:
                results.append(rr)
                print(f"  [{len(results)}/350] OK {rr[0]}")
                if len(results) >= 350: break

          print(f"FINAL: {len(results)} new PDFs")
          if results:
            combined = "\n".join([r[1] for r in results])
            max_part = -1
            for fn in os.listdir('.'):
              import re as re2
              m = re2.match(r'master_imo_all_public_part(\d+)\.txt', fn)
              if m: max_part = max(max_part, int(m.group(1)))
            next_file = f'master_imo_all_public_part{max_part+1}.txt'
            open(next_file,'w',encoding='utf-8').write(combined)
            print(f"Saved to {next_file}")
          PY

      - name: Push to repo
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add master_imo_all_public_part*.txt || true
          git commit -m "add 300+ IMO full capture" || true
          git push || true
