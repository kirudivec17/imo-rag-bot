name: Build 1000+ ALL IMO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 pypdf langchain-text-splitters lxml --quiet
      - name: Build REAL list
        run: |
          python - << 'PY'
          import requests, os, re, warnings, concurrent.futures
          warnings.filterwarnings("ignore")
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter

          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})
          
          # IMO ke 3 master index files - inme 1500+ links hain
          INDEX_URLS = [
              "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly.pdf",
              "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MSCResolutions.pdf",
              "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPResolutions.pdf"
          ]
          
          all_pdfs = set()
          for idx_url in INDEX_URLS:
              print(f"Parsing index: {idx_url}")
              try:
                  r = s.get(idx_url, timeout=60)
                  open('/tmp/idx.pdf','wb').write(r.content)
                  reader = PdfReader('/tmp/idx.pdf')
                  text = ""
                  for p in reader.pages:
                      text += (p.extract_text() or "") + "\n"
                  # is text me se saare http links nikalo
                  links = re.findall(r'https?://[^\s\)]+\.pdf', text)
                  print(f"  -> Found {len(links)} links in index")
                  for l in links:
                      all_pdfs.add(l.strip())
                  # relative links bhi
                  rel = re.findall(r'/localresources/[^\s\)]+\.pdf', text)
                  for l in rel:
                      all_pdfs.add("https://wwwcdn.imo.org" + l)
              except Exception as e:
                  print(f"  Error {e}")

          print(f"\nTOTAL UNIQUE PDFs from indexes: {len(all_pdfs)}")

          # Existing check
          existing = set()
          for fn in os.listdir('.'):
              if 'master_imo_all_public_part' in fn:
                  try:
                      txt = open(fn, encoding='utf-8', errors='ignore').read()
                      for m in re.findall(r'SOURCE:\s*([^\s\n]+\.pdf)', txt):
                          existing.add(m)
                  except: pass
          print(f"Already have in repo: {len(existing)}")

          new_urls = [u for u in all_pdfs if u.split('/')[-1] not in existing]
          print(f"NEW to download: {len(new_urls)}")
          
          if len(new_urls) == 0:
              print("No new files, but trying 200 old missing with direct retry")
              new_urls = list(all_pdfs)[:200]

          splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=150)

          def process(url):
              try:
                  fname = url.split('/')[-1][-80:]
                  rr = s.get(url, timeout=90)
                  if len(rr.content) < 10000: return None
                  open('/tmp/t.pdf','wb').write(rr.content)
                  reader = PdfReader('/tmp/t.pdf')
                  txt = ""
                  for pg in reader.pages[:20]:
                      txt += (pg.extract_text() or "") + "\n"
                  if len(txt) < 500: return None
                  chunks = splitter.split_text(txt)
                  out = ""
                  for ch in chunks:
                      out += f"SOURCE: {fname}\nURL: {url}\n{ch}\n---\n"
                  return (fname, out)
              except:
                  return None

          results = []
          print("Starting download with 12 workers...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              futs = [ex.submit(process, u) for u in new_urls[:500]]
              for f in concurrent.futures.as_completed(futs):
                  r = f.result()
                  if r:
                      results.append(r)
                      print(f"  OK {len(results)}: {r[0]}")

          print(f"\nFINAL: Downloaded {len(results)} new PDFs")
          if results:
              combined = "\n".join([r[1] for r in results])
              # next part
              max_part = -1
              for fn in os.listdir('.'):
                  m = re.match(r'master_imo_all_public_part(\d+)\.txt', fn)
                  if m: max_part = max(max_part, int(m.group(1)))
              next_file = f'master_imo_all_public_part{max_part+1}.txt'
              open(next_file, 'w', encoding='utf-8').write(combined)
              print(f"Saved to {next_file} size {len(combined)}")
          PY
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add master_imo_all_public_part*.txt || true
          git commit -m "add 300+ real IMO from index PDFs" || true
          git push || true
