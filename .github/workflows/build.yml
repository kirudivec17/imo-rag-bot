name: Build Master Chunks Mobile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pypdf langchain-text-splitters requests
      - run: |
          python << 'PY'
          from pypdf import PdfReader
          from langchain_text_splitters import RecursiveCharacterTextSplitter
          import requests, io
          splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=200)
          urls = [
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.379(80).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.405(83).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.269(68).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.210(63).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.1155(32).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.1156(32).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.1157(32).pdf",
            "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/AssemblyDocuments/A.1158(32).pdf"
          ]
          chunks=[]
          for url in urls:
              try:
                  print(f"Downloading {url}")
                  r=requests.get(url, timeout=60)
                  reader=PdfReader(io.BytesIO(r.content))
                  text="".join([p.extract_text() or "" for p in reader.pages])
                  for c in splitter.split_text(text):
                      chunks.append(f"SOURCE: {url.split('/')[-1]}\n{c}")
              except Exception as e:
                  print(f"Fail {url}: {e}")
          open('master_imo_chunks.txt','w',encoding='utf-8').write('\n\n---CHUNK---\n\n'.join(chunks))
          print(f"Total {len(chunks)} chunks")
          PY
      - run: |
          git config user.name "mobile-bot"
          git config user.email "bot@mobile.com"
          git add master_imo_chunks.txt
          git commit -m "add master chunks 20 files mobile build" || echo "no change"
          git push
