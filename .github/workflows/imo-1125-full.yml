name: IMO 1125 PDFs Full - 5 Workers Fixed
on:
  workflow_dispatch:
  push:
    paths:
      - 'master_imo_all_public_part*.txt'
      - '.github/workflows/imo-1125-full.yml'
      - 'imo_public_summary.txt'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [1, 2, 3, 4, 5]
      max-parallel: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Worker ${{ matrix.worker }} Extract
        run: |
          mkdir -p part_${{ matrix.worker }}
          echo "Worker ${{ matrix.worker }} scanning 110 parts..."
          
          if ls master_imo_all_public_part*.txt 1>/dev/null 2>&1; then
            # PATTERN 1: A.1001(25) type - 600+ docs
            grep -h -oE "A\.[0-9]+\([0-9]+\)" master_imo_all_public_part*.txt > /tmp/p1.txt || true
            
            # PATTERN 2: MEPC, MSC resolutions
            grep -h -oE "MEPC\.[0-9]+\([0-9]+\)|MSC\.[0-9]+\([0-9]+\)" master_imo_all_public_part*.txt > /tmp/p2.txt || true
            
            # PATTERN 3: Slash wale - MSC.1/Circ, MEPC.1/Circ - 187 missing wale
            grep -h -oE "MSC\.[0-9]+/Circ\.[0-9]+|MEPC\.[0-9]+/Circ\.[0-9]+|MSC\.1/Circ\.[0-9]+|MEPC\.1/Circ\.[0-9]+|A\.[0-9]+/Res\.[0-9]+|MSC-MEPC\.[0-9]+/Circ\.[0-9]+" master_imo_all_public_part*.txt > /tmp/p3.txt || true
            
            # PATTERN 4: FAL, LEG, LC, LP, SUA
            grep -h -oE "FAL\.[0-9]+\([0-9]+\)|LEG\.[0-9]+\([0-9]+\)|LC\.[0-9]+\([0-9]+\)|LP\.[0-9]+\([0-9]+\)" master_imo_all_public_part*.txt > /tmp/p4.txt || true
            
            # PATTERN 5: Resolution with dot
            grep -h -oE "Resolution (A|MSC|MEPC)\.[0-9]+|Resolution [A-Z]+\.[0-9]+" master_imo_all_public_part*.txt > /tmp/p5.txt || true
            
            cat /tmp/p1.txt /tmp/p2.txt /tmp/p3.txt /tmp/p4.txt /tmp/p5.txt 2>/dev/null | sort | uniq > /tmp/combined.txt
            
            # Cleaning - A.1048(27)). -> A.1048(27)
            sed -i 's/\.$//; s/))$/)/; s/\.\.$//; s/,$//' /tmp/combined.txt
            
            total=$(wc -l < /tmp/combined.txt)
            per=$(( (total + 4) / 5 ))
            start=$(( (${{ matrix.worker }} - 1) * per + 1 ))
            end=$(( start + per - 1 ))
            
            echo "Total: $total | Worker ${{ matrix.worker }}: $start-$end"
            sed -n "${start},${end}p" /tmp/combined.txt > part_${{ matrix.worker }}/chunk_${{ matrix.worker }}.txt
            wc -l part_${{ matrix.worker }}/chunk_${{ matrix.worker }}.txt
          else
            echo "A.1001(25) Worker ${{ matrix.worker }}" > part_${{ matrix.worker }}/chunk_${{ matrix.worker }}.txt
          fi

      - name: Upload part
        uses: actions/upload-artifact@v4
        with:
          name: imo-part-${{ matrix.worker }}
          path: part_${{ matrix.worker }}/
          retention-days: 1

  merge-1125:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all 5 parts
        uses: actions/download-artifact@v4
        with:
          path: all_downloads
          
      - name: Merge to 1125 Final List - All Files
        run: |
          mkdir -p imo_pdfs
          echo "Merging 5 workers..."
          
          find all_downloads -name "*.txt" -exec cat {} \; > /tmp/raw.txt
          
          # Final cleaning - no duplicate
          cat /tmp/raw.txt | sed 's/\.$//; s/))$/)/; s/^\.//' | grep -E ".{5,}" | sort | uniq > imo_pdfs/1125_final_list.txt
          
          # File 2: 1225_final_list.txt (purane app ke liye)
          cp imo_pdfs/1125_final_list.txt imo_pdfs/1225_final_list.txt
          
          # File 3: README.txt
          count=$(wc -l < imo_pdfs/1125_final_list.txt)
          echo "IMO 1125 PDFs Collection" > imo_pdfs/README.txt
          echo "Total Unique PDFs: $count" >> imo_pdfs/README.txt
          echo "Total Chunks: 12002" >> imo_pdfs/README.txt
          echo "Total Parts: 110" >> imo_pdfs/README.txt
          echo "Generated: $(date)" >> imo_pdfs/README.txt
          echo "Workers: 5" >> imo_pdfs/README.txt
          
          # File 4: manifest.txt - summary
          echo "IMO Public Summary" > imo_pdfs/manifest.txt
          cat imo_public_summary.txt 2>/dev/null >> imo_pdfs/manifest.txt || echo "Total Unique PDFs: $count" >> imo_pdfs/manifest.txt
          echo "" >> imo_pdfs/manifest.txt
          echo "Top 50 PDFs:" >> imo_pdfs/manifest.txt
          head -50 imo_pdfs/1125_final_list.txt >> imo_pdfs/manifest.txt
          
          # File 5: stats.txt
          echo "Total Unique PDFs: $count" > imo_pdfs/stats.txt
          echo "Total from summary: 1125" >> imo_pdfs/stats.txt
          echo "Coverage: $count/1125" >> imo_pdfs/stats.txt
          echo "Chunks: 12002" >> imo_pdfs/stats.txt
          
          echo "=========================="
          cat imo_pdfs/stats.txt
          echo "=========================="
          echo "Files created:"
          ls -lh imo_pdfs/
          echo ""
          head -20 imo_pdfs/1125_final_list.txt

      - name: Push all files to GitHub
        run: |
          git config user.name "IMO-1125-Bot"
          git config user.email "imo1125@bot.com"
          git add imo_pdfs/
          git commit -m "Final: All files 1125 PDFs - 5 workers - $count docs" || echo "No changes"
          git push
