name: V5 - Search Pagination - 50-60 Real

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml --quiet
      - name: V5 Pagination Search
        run: |
          python - << 'PY'
          import requests, re, os, time
          from urllib.parse import quote, urljoin
          os.makedirs("imo_pdfs", exist_ok=True)
          before = len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"Before: {before} REAL")

          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.imo.org/"})

          all_urls=set()
          queries = ["pdf","all pdf files","assembly","IMDG Code","IMO Vega","MEPC resolution","MSC resolution","List of certificates","carriage of publications","circular","guidelines","unified interpretation","SOLAS","MARPOL","ISM Code","STCW","FSS Code","LSA Code","BWM","GHG","EEDI","SEEMP","CII","EEXI"]

          # Pagination - page 1 to 10
          for q in queries:
              for page in range(1,11):
                  for url_template in [
                      f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}&page={page}",
                      f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}&p={page}",
                      f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}&start={page*10}",
                  ]:
                      try:
                          r = session.get(url_template, timeout=20)
                          if r.status_code != 200: continue
                          found = re.findall(r'https://wwwcdn\.imo\.org[^\s"\'<>]+\.pdf', r.text, re.I)
                          found += [urljoin("https://www.imo.org", u) for u in re.findall(r'/localresources/[^\s"\'<>]+\.pdf', r.text, re.I)]
                          if found:
                              print(f"q={q} page={page} -> {len(found)}")
                              all_urls.update(found)
                      except: pass
                  time.sleep(0.4)

          print(f"\nTotal unique PDF URLs from pagination: {len(all_urls)}")

          # Clean
          cleaned = [u.replace(" ","%20") for u in all_urls if "imo.org" in u.lower()]
          cleaned = list(set(cleaned))

          def dl(url):
              fn = url.split("/")[-1].split("?")[0]
              import re as re2
              fn = re2.sub(r'[^A-Za-z0-9._() -]','_',fn)
              if len(fn)<5: return "SKIP"
              path=f"imo_pdfs/{fn}"
              if os.path.exists(path) and os.path.getsize(path)>10000: return f"SKIP {fn}"
              try:
                  r=session.get(url,timeout=25)
                  if r.status_code==200 and len(r.content)>10000:
                      open(path,"wb").write(r.content)
                      return f"REAL OK {fn} {len(r.content)//1024}KB"
              except: pass
              return f"FAIL {fn}"

          ok=0
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=10) as ex:
              for msg in ex.map(dl, cleaned):
                  if "REAL OK" in msg:
                      ok+=1
                      print(msg)

          after = len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after} REAL")
          print(f"New Added: {after-before}")
          print(f"Success this run: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V5 pagination - page 1-10 for all queries - 50-60 target" || true
          git push
