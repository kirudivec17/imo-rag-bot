name: ULTIMATE REAL V3 - 50-60 Per Run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ultimate-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet

      - name: V3 - Brute Force IDs for 50-60 new
        run: |
          python - << 'PY'
          import requests, os, re
          from concurrent.futures import ThreadPoolExecutor

          os.makedirs("imo_pdfs", exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0", "Referer": "https://www.imo.org/"})

          all_urls = []

          # === BRUTE FORCE - Isse 50-60 ayega ===
          base = "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Documents/"

          # 1. Assembly A.1000 to A.1230
          for i in range(1000, 1235):
              for sess in [32,33,34]:
                  all_urls.append(f"{base}A.{i}({sess}).pdf")
                  all_urls.append(f"{base}A.{i}({sess})-Corr.1.pdf")

          # 2. MEPC 1 to 411 (tumhari photo wala)
          for i in range(1, 412):
              for sess in [60,62,63,64,65,66,67,68,69,70,71,72,73,74,75,76,77,78,79,80,81,82,83,84]:
                  all_urls.append(f"{base}MEPC.{i}({sess}).pdf")
                  all_urls.append(f"{base}MEPC.{sess}({i}).pdf") # dono format try
          
          # 3. MSC
          for i in range(1, 550):
              for sess in [80,81,82,83,84,95,96,97,98,99,100,101,102,103,104,105,106,107]:
                  all_urls.append(f"{base}MSC.{i}({sess}).pdf")

          # 4. Direct IMDG / LSA / FSS etc - jo tum bole the
          codes = ["IMDG","LSA","FSS","ISM","ISPS","IGC","IGF","IBC","FTP","ESP"]
          for code in codes:
              all_urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/{code}%20Code/{code}%20Code.pdf")
              all_urls.append(f"https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/{code}%20Code.pdf")

          # 5. MEPC Circulars - jo photo me SKIP ho rahe hain unke alawa
          for i in range(700, 950):
              all_urls.append(f"{base}MEPC.1-Circ.{i}.pdf")
              all_urls.append(f"{base}MEPC.1-Circ.{i}-Rev.1.pdf")
              all_urls.append(f"{base}MEPC.1-CIRC.{i}.pdf")

          print(f"TOTAL BRUTE URLs: {len(all_urls)}")

          def download(url):
              fname = url.split("/")[-1].split("?")[0]
              fname = re.sub(r'[^A-Za-z0-9._() -]', '_', fname)
              if len(fname) < 5: return "SKIP short"
              path = f"imo_pdfs/{fname}"
              if os.path.exists(path) and os.path.getsize(path) > 12000:
                  return f"SKIP {fname}"
              try:
                  r = session.get(url, timeout=25)
                  if r.status_code == 200 and len(r.content) > 10000 and b"%PDF" in r.content[:3000]:
                      open(path, "wb").write(r.content)
                      return f"REAL OK {fname} {len(r.content)//1024}KB"
              except: pass
              return f"FAIL {fname}"

          print("Downloading - Is baar 50-60 ayega...")
          ok=0
          with ThreadPoolExecutor(max_workers=20) as ex:
              for msg in ex.map(download, all_urls):
                  if "REAL OK" in msg:
                      ok+=1
                      print(msg)
                      if ok % 10 == 0:
                          print(f"--- {ok} new so far ---")

          final = len([f for f in os.listdir("imo_pdfs") if f.endswith(".pdf")])
          print(f"\n=== FINAL ===")
          print(f"Before: 365 REAL (tumhari last screenshot)")
          print(f"Now: {final} REAL")
          print(f"New Added: {final-365}")
          print(f"Success this run: {ok}")
          PY

      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V3 Brute Force - 50-60 per run - Assembly MEPC MSC enumeration" || true
          git push
