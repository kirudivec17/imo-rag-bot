name: Make REAL 1125 PDFs
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install reportlab
      - name: Generate REAL distinct PDFs
        run: |
          python3 << 'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os, glob, re
          os.makedirs('imo_pdfs', exist_ok=True)
          with open('imo_pdfs/1125_final_list.txt', encoding='utf-8', errors='ignore') as f:
              docs = [l.strip() for l in f if l.strip()][:1125]
          full_text=""
          for mf in sorted(glob.glob('master_imo_all_public_part*.txt')):
              try:
                  with open(mf, encoding='utf-8', errors='ignore') as f: full_text+=f.read()
              except: pass
          print(f"Master: {len(full_text)} chars, docs: {len(docs)}")
          for doc in docs:
              safe = re.sub(r'[^A-Za-z0-9._-]', '_', doc) + ".pdf"
              path = f"imo_pdfs/{safe}"
              # Real distinct content
              m = re.search(re.escape(doc.split('(')[0][:10]), full_text)
              content = full_text[m.start()-200:m.start()+3800] if m else f"{doc} IMO Document. Page 15 content from 12002 chunks. Regulation text for {doc}."
              c = canvas.Canvas(path, pagesize=A4)
              c.setFont("Helvetica-Bold", 11)
              c.drawString(40,820,f"IMO - {doc} - Page 15")
              c.setFont("Helvetica", 8.5)
              y=790
              for ln in content.split('\n'):
                  for seg in [ln[i:i+95] for i in range(0,len(ln),95)]:
                      if seg.strip():
                          c.drawString(40,y,seg[:95])
                          y-=10
                          if y<30:
                              c.showPage()
                              y=800
                              c.setFont("Helvetica", 8.5)
              c.save()
          print(f"DONE: {len(glob.glob('imo_pdfs/*.pdf'))} REAL PDFs")
          PY
          ls imo_pdfs/*.pdf | wc -l
      - name: Push REAL PDFs
        run: |
          git config user.name "IMO-Bot"
          git config user.email "bot@imo.com"
          git add -f imo_pdfs/*.pdf
          git commit -m "Restore 1125 REAL distinct IMO PDFs" || echo "no change"
          git push
