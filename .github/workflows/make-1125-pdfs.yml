name: Make CLEAN IMO PDFs
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install reportlab
      - run: |
          python3 << 'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os, glob, re
          os.makedirs('imo_pdfs', exist_ok=True)
          with open('imo_pdfs/1125_final_list.txt', encoding='utf-8', errors='ignore') as f:
              docs = [l.strip() for l in f if l.strip()][:1125]
          full=""
          for mf in sorted(glob.glob('master_imo_all_public_part*.txt')):
              try:
                  with open(mf, encoding='utf-8', errors='ignore') as f: full+=f.read()
              except: pass
          def clean_text(t):
              t=re.sub(r'--CHUNK--.*?SOURCE:.*?\.pdf', '', t, flags=re.DOTALL|re.IGNORECASE)
              t=re.sub(r'SOURCE:.*\.pdf', '', t, flags=re.IGNORECASE)
              t=re.sub(r'Annex 13.*|1\.MEPC.*\.docx|AMENDMENTS TO.*', '', t, flags=re.IGNORECASE)
              t=re.sub(r'\n\s*\n', '\n', t)
              return t.strip()
          for doc in docs:
              safe=re.sub(r'[^A-Za-z0-9._-]', '_', doc)+".pdf"
              path=f"imo_pdfs/{safe}"
              # Find real content for this doc
              key=doc.split('(')[0][:12]
              m=re.search(re.escape(key), full, re.IGNORECASE)
              raw=full[m.start()-300:m.start()+4500] if m else f"{doc} - IMO Resolution - Inventory of Hazardous Materials guidelines under Hong Kong Convention."
              txt=clean_text(raw)
              c=canvas.Canvas(path, pagesize=A4)
              c.setFont("Helvetica-Bold", 12)
              c.drawString(40,820,f"INTERNATIONAL MARITIME ORGANIZATION")
              c.setFont("Helvetica-Bold", 10)
              c.drawString(40,802,f"{doc} - Page 15")
              c.setLineWidth(0.5)
              c.line(40,798,555,798)
              c.setFont("Helvetica", 9.5)
              y=775
              for para in txt.split('\n'):
                  if not para.strip(): 
                      y-=8; continue
                  # wrap
                  words=para.strip().split()
                  line=""
                  for w in words:
                      if len(line+" "+w)<92:
                          line=(line+" "+w).strip()
                      else:
                          if y<40:
                              c.showPage(); c.setFont("Helvetica",9.5); y=800
                          c.drawString(40,y,line); y-=13; line=w
                  if line:
                      if y<40:
                          c.showPage(); c.setFont("Helvetica",9.5); y=800
                      c.drawString(40,y,line); y-=13
                  y-=4
              c.save()
          print(f"CLEAN PDFs DONE: {len(glob.glob('imo_pdfs/*.pdf'))}")
          PY
      - run: |
          git config user.name "IMO-Bot"
          git config user.email "bot@imo.com"
          git add -f imo_pdfs/*.pdf
          git commit -m "Final CLEAN IMO PDFs - removed CHUNK markers - Real Page 15" || true
          git push
