name: V12 Wayback - Real 50 Beyond 397

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v12:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: V12 Wayback CDX
        run: |
          python3 << 'PY'
          import os, re, requests, time
          from urllib.parse import unquote

          os.makedirs("imo_pdfs", exist_ok=True)
          # fake <12KB delete
          for f in os.listdir("imo_pdfs"):
              fp=os.path.join("imo_pdfs",f)
              try:
                  if os.path.getsize(fp)<12000:
                      os.remove(fp)
              except: pass
          before=len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"Before: {before}")

          sess=requests.Session()
          sess.headers.update({"User-Agent":"Mozilla/5.0"})

          all_urls=set()

          # Wayback CDX API - ye GitHub pe block nahi hota
          cdx_queries=[
              "https://web.archive.org/cdx/search/web?url=wwwcdn.imo.org/localresources/en/OurWork/Environment/Documents/&output=text&fl=original&collapse=urlkey&limit=2000",
              "https://web.archive.org/cdx/search/web?url=wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/&output=text&fl=original&collapse=urlkey&limit=2000",
              "https://web.archive.org/cdx/search/web?url=wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Documents/&output=text&fl=original&collapse=urlkey&limit=2000",
              "https://web.archive.org/cdx/search/web?url=www.imo.org/localresources/en/&output=text&fl=original&collapse=urlkey&limit=2000",
          ]

          for cdx in cdx_queries:
              try:
                  print(f"Fetching CDX: {cdx[:70]}...")
                  r=sess.get(cdx, timeout=40)
                  if r.status_code==200:
                      lines=r.text.splitlines()
                      for line in lines:
                          if ".pdf" in line.lower():
                              # original URL is the line itself in text mode
                              url=line.strip()
                              if "imo.org" in url and ".pdf" in url.lower():
                                  all_urls.add(url)
                      print(f" -> Found {len(lines)} entries")
                  time.sleep(1)
              except Exception as e:
                  print(f"CDX fail {e}")

          print(f"\nTotal unique from Wayback: {len(all_urls)}")

          def dl(url):
              try:
                  raw=unquote(url.split("/")[-1].split("?")[0].split("#")[0])
                  fn=re.sub(r'[^A-Za-z0-9._() -]','_',raw)
                  if len(fn)<5: return "SKIP"
                  if not fn.lower().endswith(".pdf"): fn+=".pdf"
                  path=f"imo_pdfs/{fn}"
                  if os.path.exists(path) and os.path.getsize(path)>12000:
                      return "SKIP"
                  # Download direct from wwwcdn, not from web.archive
                  r=sess.get(url, timeout=30)
                  if r.status_code==200 and len(r.content)>12000 and b"%PDF" in r.content[:6000]:
                      open(path,"wb").write(r.content)
                      return f"REAL OK {fn} {len(r.content)//1024}KB"
              except: pass
              return "FAIL"

          ok=0
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=6) as ex:
              for m in ex.map(dl, list(all_urls)):
                  if "REAL OK" in m:
                      ok+=1
                      print(m)
                      if ok>=60:
                          print("60 reached, stopping")
                          break

          after=len([f for f in os.listdir("imo_pdfs") if os.path.getsize(os.path.join("imo_pdfs",f))>12000])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after}")
          print(f"New Added: {after-before}")
          print(f"Success: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V12 wayback beyond index - 50 target" || true
          git push
