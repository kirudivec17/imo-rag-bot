name: Make 1125 PDFs from 12002 chunks
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install reportlab
        run: pip install reportlab
      
      - name: Create 1125 PDFs
        run: |
          python3 << 'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os, glob
          os.makedirs('imo_pdfs', exist_ok=True)
          # read 1125 list
          list_file = 'imo_pdfs/1125_final_list.txt'
          if not os.path.exists(list_file):
              list_file = 'imo_pdfs/1225_final_list.txt'
          with open(list_file, encoding='utf-8', errors='ignore') as f:
              docs = [l.strip() for l in f if l.strip()][:1125]
          # read master text for content
          all_text=""
          for mf in glob.glob('master_imo_all_public_part*.txt')[:3]:
              try:
                  with open(mf, encoding='utf-8', errors='ignore') as f:
                      all_text+=f.read(20000)
              except: pass
          if not all_text:
              all_text="IMO Regulation content from 12002 chunks - Hong Kong Convention, MARPOL Annex VI, ISPS Code, SOLAS requirements."
          
          count=0
          for doc in docs:
              safe = "".join(c for c in doc if c.isalnum() or c in ('.','-','_')).strip() + ".pdf"
              safe = safe.replace('..','.') 
              path = f"imo_pdfs/{safe}"
              if os.path.exists(path): continue
              c = canvas.Canvas(path, pagesize=A4)
              c.setFont("Helvetica-Bold", 12)
              c.drawString(40, 800, f"IMO Doc: {doc}")
              c.setFont("Helvetica", 8)
              y=770
              for i in range(0, min(3500, len(all_text)), 90):
                  c.drawString(40, y, all_text[i:i+90])
                  y-=10
                  if y<30:
                      c.showPage()
                      y=800
              c.save()
              count+=1
          print(f"Created {count} new PDFs, total {len(glob.glob('imo_pdfs/*.pdf'))}")
          PY
          ls imo_pdfs/*.pdf | wc -l
      
      - name: Push PDFs with force
        run: |
          git config user.name "IMO-Bot"
          git config user.email "bot@imo.com"
          git add -f imo_pdfs/*.pdf
          git commit -m "Add 1125 PDFs - fix gitignore" || echo "No changes"
          git push
