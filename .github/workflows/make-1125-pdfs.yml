name: DELETE FAKE - Keep Only Real 394

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Before: $(ls imo_pdfs | wc -l) PDFs"
          # Keep only real MEPC ones (size > 50KB and real %PDF)
          mkdir -p real_backup
          for f in imo_pdfs/*.pdf; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 40000 ]; then
              # Check if contains real IMO text, not our placeholder
              if grep -q "SOURCE:" "$f" 2>/dev/null; then
                rm "$f"
              else
                mv "$f" real_backup/
              fi
            else
              rm "$f" 2>/dev/null || true
            fi
          done
          rm -rf imo_pdfs imo_chunks
          mkdir -p imo_pdfs imo_chunks
          mv real_backup/* imo_pdfs/ 2>/dev/null || true
          echo "After cleanup: $(ls imo_pdfs | wc -l) REAL PDFs left"
          ls imo_pdfs | head -20
      - run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ 
          git rm -rf imo_chunks/ || true
          git commit -m "DELETE 31k fake - keep only REAL IMO PDFs - honest database" || true
          git push
