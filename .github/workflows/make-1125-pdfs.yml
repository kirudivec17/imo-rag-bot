name: FIXED Scrape IMO Index Real PDFs - 5 workers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 --quiet

      - name: Scrape REAL PDF links from IMO Index with 5 workers
        run: |
          python3 << 'PY'
          import requests, os, concurrent.futures, re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          os.makedirs("imo_pdfs", exist_ok=True)
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})

          # Tumhare screenshot wala page
          pages = [
            "https://www.imo.org/en/OurWork/Environment/Pages/Index-of-MEPC-Resolutions-and-Guidelines-related-to-MARPOL-Annex-VI.aspx",
            "https://www.imo.org/en/MediaCentre/HotTopics/Pages/Sulphur-2020.aspx",
          ]

          all_pdf_links = []
          for page_url in pages:
              print(f"Fetching {page_url}")
              try:
                  r = s.get(page_url, timeout=30)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = a['href']
                      txt = a.get_text(strip=True)
                      # Real PDF link
                      if '.pdf' in href.lower() or 'MEPC' in txt or 'Circ' in txt:
                          full = urljoin(page_url, href)
                          if full.lower().endswith('.pdf'):
                              all_pdf_links.append((txt or "doc", full))
              except Exception as e:
                  print(f"Error page {e}")

          # Deduplicate
          uniq = {}
          for t,u in all_pdf_links:
              uniq[u] = t
          all_pdf_links = [(v,k) for k,v in uniq.items()]

          print(f"\nFound REAL PDF links: {len(all_pdf_links)}")
          for t,u in all_pdf_links[:20]:
              print(f"  {t} -> {u}")

          def download_one(item):
              name, url = item
              # Safe filename from URL
              safe_name = url.split('/')[-1].split('?')[0]
              if not safe_name.lower().endswith('.pdf'):
                  safe_name = name.replace("/","_").replace(" ","_")[:80] + ".pdf"
              if not safe_name:
                  safe_name = name.replace("/","_") + ".pdf"
              path = f"imo_pdfs/{safe_name}"
              if os.path.exists(path):
                  return f"Skip {safe_name}"
              try:
                  rr = s.get(url, timeout=30)
                  if rr.status_code==200 and len(rr.content)>3000:
                      open(path, 'wb').write(rr.content)
                      return f"OK {safe_name} {len(rr.content)}"
                  else:
                      return f"Fail {url} {rr.status_code} {len(rr.content)}"
              except Exception as e:
                  return f"Error {url} {e}"

          ok=0
          print("\nStarting 5 workers download REAL PDFs...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              results = list(ex.map(download_one, all_pdf_links))

          for r in results:
              print(r)
              if r.startswith("OK"):
                  ok+=1

          print(f"\nFINAL Downloaded NEW: {ok}")
          print(f"Total PDFs in imo_pdfs: {len(os.listdir('imo_pdfs'))}")
          PY

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "FIXED: Real IMO PDFs from Index page - 5 workers" || true
          git push
