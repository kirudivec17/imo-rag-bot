name: Rebuild 1125 PDFs - 5 Workers

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete only bad PDFs - Keep 13 master parts safe
        run: |
          rm -rf imo_pdfs
          mkdir -p imo_pdfs
          echo "Old IMO_DOC PDFs deleted"
          echo "13 master parts safe - not deleted"

  build:
    needs: clean
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pypdf

      - name: Run worker ${{ matrix.worker_id }}
        run: python ingest.py --worker-id ${{ matrix.worker_id }} --workers 5

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ matrix.worker_id }}
          path: imo_pdfs/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: imo_pdfs/
          merge-multiple: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add imo_pdfs/
          git commit -m "Final 1125 PDFs - 5 workers - docs" || true
          git push
