name: V14 Serper Google - 50+ Real Target

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v14:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: V14 Serper Search
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          python3 << 'PY'
          import os, re, requests, json, time
          from urllib.parse import unquote

          SERPER_KEY=os.getenv("SERPER_API_KEY")
          if not SERPER_KEY:
              print("ERROR: SERPER_API_KEY secret nahi mila!")
              print("GEMINI_KEY se kaam nahi chalega, Serper.dev se key laake Secret me daal.")
              exit(1)

          os.makedirs("imo_pdfs", exist_ok=True)
          for f in os.listdir("imo_pdfs"):
              fp=os.path.join("imo_pdfs",f)
              try:
                  if os.path.getsize(fp)<12000:
                      os.remove(fp)
              except: pass
          before=len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"Before: {before}")

          sess=requests.Session()
          all_urls=set()

          # Serper se Google search - ye GitHub pe block nahi hota
          queries=[
              "site:wwwcdn.imo.org filetype:pdf",
              "site:imo.org filetype:pdf MEPC resolution",
              "site:imo.org filetype:pdf MSC resolution",
              "site:imo.org filetype:pdf LSA Code FSS Code",
              "site:imo.org filetype:pdf IMDG Code",
          ]

          for q in queries:
              for page in [1,2,3,4,5]: # 5 pages = 50 results per query
                  try:
                      payload=json.dumps({"q":q,"page":page,"num":10})
                      headers={"X-API-KEY":SERPER_KEY,"Content-Type":"application/json"}
                      r=requests.post("https://google.serper.dev/search", headers=headers, data=payload, timeout=20)
                      if r.status_code!=200:
                          print(f"Serper fail {r.status_code} {r.text[:100]}")
                          continue
                      data=r.json()
                      links=data.get("organic",[])
                      found=0
                      for item in links:
                          link=item.get("link","")
                          if ".pdf" in link.lower() and "imo.org" in link.lower():
                              all_urls.add(link)
                              found+=1
                          # snippet me bhi pdf link ho sakta hai
                          snippet=item.get("snippet","")
                          pdfs=re.findall(r'https://wwwcdn\.imo\.org[^\s"\'<>]+\.pdf', snippet, re.I)
                          for p in pdfs:
                              all_urls.add(p)
                              found+=1
                      print(f"Serper Q={q[:30]} page {page} -> {found} links")
                      time.sleep(0.5)
                  except Exception as e:
                      print(f"Serper err {e}")

          print(f"\nTotal unique from Serper Google: {len(all_urls)}")

          def dl(url):
              try:
                  raw=unquote(url.split("/")[-1].split("?")[0].split("#")[0].split("&")[0])
                  fn=re.sub(r'[^A-Za-z0-9._() -]','_',raw)
                  if len(fn)<5: return "SKIP"
                  if not fn.lower().endswith(".pdf"): fn+=".pdf"
                  path=f"imo_pdfs/{fn}"
                  if os.path.exists(path) and os.path.getsize(path)>12000:
                      return "SKIP"
                  rr=sess.get(url, timeout=35)
                  if rr.status_code==200 and len(rr.content)>12000 and b"%PDF" in rr.content[:6000]:
                      open(path,"wb").write(rr.content)
                      return f"REAL OK {fn} {len(rr.content)//1024}KB"
              except: pass
              return "FAIL"

          ok=0
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=5) as ex:
              for m in ex.map(dl, list(all_urls)):
                  if "REAL OK" in m:
                      ok+=1
                      print(m)
                      if ok>=70:
                          break

          after=len([f for f in os.listdir("imo_pdfs") if os.path.getsize(os.path.join("imo_pdfs",f))>12000])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after}")
          print(f"New Added: {after-before}")
          print(f"Success: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V14 serper google - real 50+" || true
          git push
