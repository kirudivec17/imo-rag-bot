name: V21 Create imo_pdfs_2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split 1271 into 2 folders
        run: |
          echo "Before split:"
          ls imo_pdfs | wc -l
          
          mkdir -p imo_pdfs_2
          mkdir -p imo_pdfs

          # 1000 files imo_pdfs me rakho, baaki 271 imo_pdfs_2 me bhejo
          cd imo_pdfs
          files=$(ls -1 | sort)
          count=0
          for f in $files; do
            count=$((count+1))
            if [ $count -gt 1000 ]; then
              mv "$f" ../imo_pdfs_2/
            fi
          done
          cd ..
          
          echo "After split:"
          echo -n "imo_pdfs count: "
          ls imo_pdfs | wc -l
          echo -n "imo_pdfs_2 count: "
          ls imo_pdfs_2 | wc -l

      - name: Push both folders
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/
          git commit -m "V21 split 1271 into 1000 + 271 - fix truncate warning" || true
          git push
