name: Build Assembly + Council Missing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pypdf fpdf2 --quiet
      - name: Download Assembly Council
        run: |
          python3 << 'PY'
          import requests, os, re, urllib.parse
          from pypdf import PdfReader
          from fpdf import FPDF
          from collections import defaultdict

          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})

          os.makedirs("imo_pdfs", exist_ok=True)
          
          # Assembly resolutions ke real direct links
          # IMO site pe ye pattern hai
          bases = [
              "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/",
              "https://www.imo.org/en/KnowledgeCentre/IndexofIMOResolutions/Documents/",
              "https://docs.imo.org/docs/Documents/",
          ]
          
          targets = []
          # Assembly A.1000 se A.1180 tak (tumhara A.1155 isi me hai)
          for n in range(1000, 1181):
              for sess in [28,29,30,31,32,33]:
                  for fmt in [f"A {n}({sess})", f"A.{n}({sess})", f"A {n}-{sess}", f"Resolution A.{n}({sess})", f"A-{n}({sess})"]:
                      for b in bases:
                          targets.append((b + fmt.replace(" ", "%20") + ".pdf", f"{fmt}.pdf"))
          
          # Council
          for n in range(1, 150):
              for sess in [120,121,122,123,124,125,126,127,128,129,130]:
                  targets.append((f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Council/C%20{n}({sess}).pdf", f"C {n}({sess}).pdf"))

          print(f"Trying {len(targets)} Assembly/Council URLs")

          def save_as_pdf(url, wanted_name):
              try:
                  r = s.get(url, timeout=25)
                  if r.status_code!=200 or len(r.content)<10000: return False
                  if not r.content.startswith(b'%PDF'): return False
                  # direct save original PDF - best for RAG
                  safe = wanted_name.replace("/", "_")
                  open(f"imo_pdfs/{safe}", "wb").write(r.content)
                  print(f"OK {safe} from {url}")
                  return True
              except Exception as e:
                  return False

          ok=0
          for url,name in targets:
              if os.path.exists(f"imo_pdfs/{name.replace('/', '_')}"): continue
              if save_as_pdf(url,name):
                  ok+=1
                  if ok>200: break

          print(f"Downloaded {ok} new Assembly/Council PDFs")
          
          # Also rebuild from existing master parts for missing ones
          docs = defaultdict(list)
          cur_src=None
          cur=[]
          import glob
          for fn in sorted(glob.glob("master_imo_all_public_part*.txt")):
              try:
                  for line in open(fn, encoding='utf-8', errors='ignore'):
                      if line.startswith("SOURCE:"):
                          if cur_src and cur: docs[cur_src].append("".join(cur))
                          cur_src=line.replace("SOURCE:","").strip()
                          cur=[]
                      elif "---CHUNK---" in line:
                          if cur_src and cur: docs[cur_src].append("".join(cur))
                          cur=[]
                      else:
                          cur.append(line)
              except: pass
          
          print(f"Master parts have {len(docs)} sources total")
          PY

      - name: Commit with pull
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "Add Assembly A.1155 etc + Council missing PDFs" || echo "nothing"
          git push
