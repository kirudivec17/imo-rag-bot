name: Assembly Scrape A.1 to A.1192 - 5 workers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 --quiet

      - name: Scrape Assembly Resolutions - 5 workers
        run: |
          python3 << 'PY'
          import requests, os, concurrent.futures, re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          os.makedirs("imo_pdfs", exist_ok=True)
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})

          # Assembly Index - ye main page hai
          assembly_pages = [
            "https://www.imo.org/en/KnowledgeCentre/IndexofIMOResolutions/Pages/Assembly.aspx",
            "https://www.imo.org/en/MediaCentre/HotTopics/Pages/Assembly-33rd-session.aspx",
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/Assembly-32nd-session.aspx",
          ]

          all_pdf_links = []
          for page_url in assembly_pages:
              print(f"\nScanning {page_url}")
              try:
                  r = s.get(page_url, timeout=30)
                  soup = BeautifulSoup(r.text, 'html.parser')
                  for a in soup.find_all('a', href=True):
                      href = a['href']
                      txt = a.get_text(strip=True)
                      # Assembly PDF pattern: A 1106(29) etc or .pdf
                      if '.pdf' in href.lower() or re.match(r'A\.\d+\(\d+\)', txt):
                          full = urljoin(page_url, href)
                          all_pdf_links.append((txt, full))
              except Exception as e:
                  print(f"Error {e}")

          # Deduplicate by URL
          uniq = {}
          for t,u in all_pdf_links:
              uniq[u] = t
          all_pdf_links = [(v,k) for k,v in uniq.items()]
          print(f"\nTotal Assembly PDF links found: {len(all_pdf_links)}")
          for t,u in all_pdf_links[:20]:
              print(f"  {t} -> {u}")

          def download_one(item):
              name, url = item
              # Clean filename
              if url.lower().endswith('.pdf'):
                  safe = url.split('/')[-1].split('?')[0]
                  if len(safe)<5:
                      safe = name.replace("/","_").replace(" ","_") + ".pdf"
              else:
                  safe = name.replace("/","_").replace(" ","_")[:80] + ".pdf"
              if not safe.lower().endswith('.pdf'):
                  safe += ".pdf"
              # Make A. prefix safe
              safe = safe.replace("..",".").replace("//","_")
              path = f"imo_pdfs/{safe}"
              if os.path.exists(path):
                  return f"Skip {safe}"
              try:
                  rr = s.get(url, timeout=30)
                  if rr.status_code==200 and len(rr.content)>3000:
                      open(path, 'wb').write(rr.content)
                      return f"OK {safe} {len(rr.content)//1024}KB"
                  else:
                      return f"Fail {safe} {rr.status_code}"
              except Exception as e:
                  return f"Error {name} {e}"

          ok=0
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              for res in ex.map(download_one, all_pdf_links):
                  print(res)
                  if res.startswith("OK"):
                      ok+=1

          print(f"\nFINAL Assembly NEW Downloaded: {ok}")
          print(f"Total PDFs in imo_pdfs: {len(os.listdir('imo_pdfs'))}")

          # If Assembly index didn't give many PDFs, also try direct IMO CDN pattern for A docs
          if ok < 50:
              print("\nTrying direct Assembly CDN pattern A.1 to A.1200...")
              direct_jobs=[]
              for i in range(1, 1200):
                  # Common pattern: A 32/Res.1155 etc - try multiple CDN paths
                  direct_jobs.append((f"A.{i}(29)", f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{i}(29).pdf"))
                  direct_jobs.append((f"A.{i}(32)", f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{i}(32).pdf"))
                  direct_jobs.append((f"A.{i}(33)", f"https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Assembly/A%20{i}(33).pdf"))

              def dl_direct(item):
                  name, url = item
                  safe = f"A.{name.split('.')[1].split('(')[0]}.pdf".replace("/","_")
                  path = f"imo_pdfs/{safe}"
                  if os.path.exists(path):
                      return f"Skip {safe}"
                  try:
                      rr = s.get(url, timeout=10)
                      if rr.status_code==200 and len(rr.content)>5000 and b'%PDF' in rr.content[:10]:
                          open(path,'wb').write(rr.content)
                          return f"OK-DIRECT {safe}"
                  except:
                      pass
                  return f"Fail-D {name}"

              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
                  for res in ex.map(dl_direct, direct_jobs[:2000]):
                      if res.startswith("OK-DIRECT"):
                          print(res)
                          ok+=1

              print(f"\nAfter direct attempt, Total PDFs: {len(os.listdir('imo_pdfs'))}")
          PY

      - name: Commit Assembly
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "Assembly A.1 to A.1192 scrape - 5 workers" || true
          git push
