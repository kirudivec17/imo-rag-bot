name: V21 Fix Split Space Safe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v21fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Split 1271 into 2 folders - Python Safe
        run: |
          python3 << 'PY'
          import os, shutil
          os.makedirs("imo_pdfs_2", exist_ok=True)
          files = sorted([f for f in os.listdir("imo_pdfs") if os.path.isfile(os.path.join("imo_pdfs", f))])
          print(f"Before split: {len(files)}")
          # 1000 imo_pdfs me rakho, baaki imo_pdfs_2 me
          for i, f in enumerate(files):
              if i >= 1000:
                  src = os.path.join("imo_pdfs", f)
                  dst = os.path.join("imo_pdfs_2", f)
                  try:
                      shutil.move(src, dst)
                  except Exception as e:
                      print(f"err {f} {e}")
          print(f"After:")
          print(f"imo_pdfs: {len(os.listdir('imo_pdfs'))}")
          print(f"imo_pdfs_2: {len(os.listdir('imo_pdfs_2'))}")
          PY
      - name: Push both folders
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/
          git commit -m "V21 fix split 1271 into 1000+271 space safe" || true
          git push
