name: Audit - Where are all PDFs

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 << 'PY'
          import glob, re, urllib.parse
          from collections import Counter

          sources = []
          for fn in sorted(glob.glob("master_imo_all_public_part*.txt")):
              txt = open(fn, encoding='utf-8', errors='ignore').read()
              for m in re.findall(r'SOURCE:\s*([^\n]+)', txt):
                  sources.append(m.strip())

          print(f"Total SOURCE entries (with duplicates): {len(sources)}")
          uniq = sorted(set(sources))
          print(f"Unique PDFs in all 13 parts: {len(uniq)}")
          for u in uniq[:50]:
              print(f" - {urllib.parse.unquote(u)}")
          print("...")
          print(f"\nLast 50:")
          for u in uniq[-50:]:
              print(f" - {urllib.parse.unquote(u)}")

          # Check imo_pdfs folder
          import os
          if os.path.exists("imo_pdfs"):
              print(f"\nimo_pdfs folder has: {len(os.listdir('imo_pdfs'))} files")
              for f in sorted(os.listdir("imo_pdfs"))[:50]:
                  print(f"  {f}")
          else:
              print("imo_pdfs folder missing")
          PY
