name: V23 Fill imo_pdfs_2 - New Pool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v23:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: Fill Folder 2 with New Pool
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python3 << 'PY'
          import os, re, requests, json, time, hashlib, random
          SERPER_KEY=os.getenv("SERPER_API_KEY")
          os.makedirs("imo_pdfs_2", exist_ok=True)
          os.makedirs("imo_pdfs", exist_ok=True)

          existing_hashes=set()
          existing_names=set()
          for folder in ["imo_pdfs", "imo_pdfs_2"]:
              for f in os.listdir(folder):
                  existing_names.add(f.lower())
                  try:
                      with open(os.path.join(folder,f),"rb") as fh:
                          existing_hashes.add(hashlib.md5(fh.read(20000)).hexdigest())
                  except: pass
          
          before1=len(os.listdir("imo_pdfs"))
          before2=len(os.listdir("imo_pdfs_2"))
          print(f"Before: imo_pdfs={before1} imo_pdfs_2={before2} Total={before1+before2}")

          sess=requests.Session()
          all_urls=set()
          # 10 BILKUL NAYE QUERIES - V22 me use nahi hue
          queries=[
              "site:imo.org filetype:pdf IGF Code Polar Code",
              "site:imo.org filetype:pdf FSS Code FTP Code LSA",
              "site:imo.org filetype:pdf GMDSS IMDG Dangerous Goods",
              "site:imo.org filetype:pdf Ballast Water BWM Convention",
              "site:imo.org filetype:pdf GHG CII EEXI Decarbonization",
              "site:imo.org filetype:pdf III Code Audit Scheme",
              "site:imo.org filetype:pdf STCW Manila Amendments 2010",
              "site:imo.org filetype:pdf Nairobi Wreck Removal Casualty",
              "site:imo.org filetype:pdf Facilitation FAL Convention 2024",
              "site:imo.org filetype:pdf SUA Convention Maritime Security",
          ]
          calls=0
          for q in queries:
              for page in range(1,6): # 50 calls
                  calls+=1
                  try:
                      payload=json.dumps({"q":q,"page":page,"num":10})
                      headers={"X-API-KEY":SERPER_KEY,"Content-Type":"application/json"}
                      r=requests.post("https://google.serper.dev/search", headers=headers, data=payload, timeout=20)
                      for item in r.json().get("organic",[]):
                          link=item.get("link","").split("?")[0]
                          if ".pdf" in link.lower() and "imo.org" in link.lower():
                              all_urls.add(link)
                      print(f"[{calls}/50] {q[:25]} p{page} -> pool {len(all_urls)}")
                      time.sleep(0.3)
                  except Exception as e:
                      print(e)
          
          print(f"Total unique pool: {len(all_urls)} | Existing files: {len(existing_names)}")

          def dl(url):
              try:
                  fn=re.sub(r'[^A-Za-z0-9._() -]','_', __import__('urllib.parse', fromlist=['unquote']).unquote(url.split("/")[-1]))
                  if len(fn)<5: return "SKIP_SHORT"
                  if not fn.lower().endswith(".pdf"): fn+=".pdf"
                  if fn.lower() in existing_names:
                      return f"SKIP_NAME {fn}"
                  rr=sess.get(url, timeout=40)
                  if rr.status_code==200 and len(rr.content)>15000 and b"%PDF" in rr.content[:8000]:
                      h=hashlib.md5(rr.content[:20000]).hexdigest()
                      if h in existing_hashes: return "DUP_CONTENT"
                      open(f"imo_pdfs_2/{fn}","wb").write(rr.content)
                      existing_hashes.add(h)
                      existing_names.add(fn.lower())
                      return f"REAL OK {fn}"
              except Exception as e:
                  return f"FAIL {e}"
              return "FAIL"

          ok=0
          from concurrent.futures import ThreadPoolExecutor
          urls=list(all_urls); random.shuffle(urls)
          with ThreadPoolExecutor(max_workers=8) as ex:
              for m in ex.map(dl, urls):
                  if "REAL OK" in m:
                      ok+=1
                      print(m)

          after1=len(os.listdir("imo_pdfs"))
          after2=len(os.listdir("imo_pdfs_2"))
          print(f"\n=== FINAL === imo_pdfs={after1} imo_pdfs_2={after2} Total={after1+after2} Added={after2-before2} Credits {calls}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_pdfs_2/
          git commit -m "V23 new pool 50 credits" || true
          git push
