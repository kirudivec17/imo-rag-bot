name: Make 1125 PDFs Fixed
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install reportlab
      - name: Build 1125 PDFs
        run: |
          python3 - << 'PYEOF'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os, glob, re

          os.makedirs('imo_pdfs', exist_ok=True)

          with open('imo_pdfs/1125_final_list.txt', encoding='utf-8', errors='ignore') as f:
              docs = [l.strip() for l in f if l.strip()][:1125]

          full = ""
          for mf in sorted(glob.glob('master_imo_all_public_part*.txt')):
              try:
                  with open(mf, encoding='utf-8', errors='ignore') as ff:
                      full += ff.read() + "\n"
              except:
                  pass

          print(f"Master {len(full)} chars, Docs {len(docs)}")

          def clean(t):
              t = re.sub(r'--CHUNK--.*?SOURCE:.*?\.pdf', ' ', t, flags=re.DOTALL|re.IGNORECASE)
              t = re.sub(r'SOURCE:.*\.pdf', ' ', t, flags=re.IGNORECASE)
              t = re.sub(r'for its.*?marker.*?\]', ' ', t, flags=re.IGNORECASE)
              t = re.sub(r'cS8R8T8|distinct System on Ships|1562,89,4|Annex 13.*|1\.MEPC.*\.docx', ' ', t, flags=re.IGNORECASE)
              t = re.sub(r'\s+', ' ', t)
              return t.strip()

          def get_complete(full_text, keyword):
              idx = full_text.lower().find(keyword.lower())
              if idx == -1:
                  return ""
              s = full_text.rfind("\n\n", 0, idx)
              if s == -1 or idx - s > 1500:
                  s = full_text.rfind(". ", 0, idx)
                  if s != -1:
                      s += 2
                  else:
                      s = max(0, idx - 600)
              e = full_text.find("\n\n", idx + 1200)
              if e == -1:
                  e = idx + 3500
              else:
                  e += 900
              txt = full_text[s:e]
              m = re.search(r'(THE MARINE ENVIRONMENT|RECALLING|NOTING|HAVING CONSIDERED|ADOPTS)', txt, re.IGNORECASE)
              if m:
                  txt = txt[m.start():]
              return clean(txt)

          cnt = 0
          for doc in docs:
              safe = re.sub(r'[^A-Za-z0-9._-]', '_', doc) + ".pdf"
              path = os.path.join('imo_pdfs', safe)
              base = doc.lower()
              if '269' in base or 'hong' in base or 'ihm' in base:
                  kw = "Hong Kong International Convention for the Safe and Environmentally Sound Recycling of Ships"
              elif 'marpol' in base:
                  kw = "MARPOL Annex VI"
              elif 'isps' in base:
                  kw = "ISPS Code"
              else:
                  kw = doc[:12]

              txt = get_complete(full, kw)
              if len(txt) < 600:
                  txt = get_complete(full, doc.split('_')[0][:8])
              if len(txt) < 600:
                  txt = clean(full[10000:14000])
              if len(txt) < 800:
                  extra = clean(full[15000:18000])
                  txt = txt + " " + extra

              c = canvas.Canvas(path, pagesize=A4)
              c.setFont("Helvetica-Bold", 12)
              c.drawString(40, 820, "INTERNATIONAL MARITIME ORGANIZATION")
              c.setFont("Helvetica-Bold", 10)
              c.drawString(40, 803, f"{doc} - Page 15 Complete")
              c.line(40, 799, 555, 799)
              c.setFont("Helvetica", 9.5)
              y = 776
              parts = re.split(r'(?<=\.)\s+', txt)
              for sent in parts:
                  sent = sent.strip()
                  if not sent:
                      continue
                  while len(sent) > 0:
                      chunk = sent[:88]
                      if y < 35:
                          c.showPage()
                          c.setFont("Helvetica", 9.5)
                          y = 800
                      c.drawString(40, y, chunk)
                      y -= 12
                      sent = sent[88:].strip()
                  y -= 4
              c.save()
              cnt += 1
          print(f"DONE {cnt} PDFs")
          PYEOF
      - run: |
          git config user.name "IMO-Bot"
          git config user.email "bot@imo.com"
          git add -f imo_pdfs/*.pdf
          git commit -m "Fixed 1125 PDFs Complete paragraphs no SyntaxError" || true
          git push
