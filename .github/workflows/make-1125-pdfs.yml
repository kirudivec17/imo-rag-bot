name: ULTIMATE V4 - Slow Fix - 50-60 Guaranteed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: V4 Slow Brute - No Block
        run: |
          python - << 'PY'
          import os, re, time, requests
          from concurrent.futures import ThreadPoolExecutor

          os.makedirs("imo_pdfs", exist_ok=True)
          before = len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"Before: {before} REAL")

          session = requests.Session()
          base = "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Documents/"

          urls = []
          # Sirf missing range - jo abhi tak nahi hai
          # Tum 372 pe ho, ab 373 se 411 tak MEPC naya hoga + Assembly 1150-1230
          for i in range(373, 412):  # 373-411 ye V2 me nahi the
              for s in [79,80,81,82,83,84]:
                  urls.append(f"{base}MEPC.{i}({s}).pdf")
          for i in range(1150, 1235): # Assembly new
              for s in [33,34]:
                  urls.append(f"{base}A.{i}({s}).pdf")
          for i in range(500, 551): # MSC new
              for s in [106,107,108]:
                  urls.append(f"{base}MSC.{i}({s}).pdf")
          # Circulars jo SKIP nahi hue
          for i in range(885, 950):
              urls.append(f"{base}MEPC.1-Circ.{i}.pdf")
              urls.append(f"{base}MEPC.1-CIRC.{i}.pdf")
              urls.append(f"{base}MEPC.1-Circ.{i}-Rev.1.pdf")

          print(f"Total new URLs to try: {len(urls)} - ye sab V2 me nahi the")

          def dl(url):
              fn = url.split("/")[-1]
              fn = re.sub(r'[^A-Za-z0-9._() -]','_',fn)
              path = f"imo_pdfs/{fn}"
              if os.path.exists(path) and os.path.getsize(path) > 10000:
                  return f"SKIP {fn}"
              # 3 headers try - slow
              for hdr in [
                  {"User-Agent":"Mozilla/5.0","Referer":"https://www.imo.org/"},
                  {"User-Agent":"Mozilla/5.0 (Windows NT 10.0)","Accept":"application/pdf"},
                  {"User-Agent":"Mozilla/5.0","Referer":"https://www.imo.org/en/KnowledgeCentre/Pages/Index-of-IMO-Resolutions.aspx"}
              ]:
                  try:
                      session.headers.update(hdr)
                      r = session.get(url, timeout=30)
                      if r.status_code == 200 and len(r.content) > 8000:
                          if b"%PDF" in r.content[:4000] or len(r.content) > 20000:
                              open(path,"wb").write(r.content)
                              return f"REAL OK {fn} {len(r.content)//1024}KB"
                      if r.status_code == 404:
                          return f"404 {fn}"
                  except Exception as e:
                      time.sleep(0.5)
                      continue
                  time.sleep(0.8)
              return f"FAIL {fn}"

          ok=0
          # 5 workers only - no block
          with ThreadPoolExecutor(max_workers=5) as ex:
              for idx, msg in enumerate(ex.map(dl, urls)):
                  if "REAL OK" in msg:
                      ok+=1
                      print(msg)
                  if idx % 50 == 0:
                      print(f"Checked {idx}/{len(urls)} - Found {ok} new")

          after = len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after} REAL")
          print(f"New Added: {after-before}")
          print(f"Success this run: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V4 slow 50-60 fix" || true
          git push
