name: Scrape Circulars MEPC.1/Circ.1-1000 - 5 workers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circulars:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests fpdf2 beautifulsoup4 --quiet
      - name: Scrape Circulars with 5 workers
        run: |
          python3 << 'PY'
          import requests, os, concurrent.futures
          from fpdf import FPDF
          from bs4 import BeautifulSoup

          os.makedirs("imo_pdfs", exist_ok=True)
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0"})

          # imorules pattern for circulars
          targets = []
          for i in range(1, 1001):
              targets.append((f"MEPC.1_Circ.{i}", f"https://imorules.com/ship/CIRC_MEPC_1_{i}.html"))
              targets.append((f"MEPC.1_Circ.{i}_Rev.1", f"https://imorules.com/ship/CIRC_MEPC_1_{i}_Rev_1.html"))
              targets.append((f"MEPC.1_Circ.{i}_Rev.2", f"https://imorules.com/ship/CIRC_MEPC_1_{i}_Rev_2.html"))
              targets.append((f"MEPC.1_Circ.884_Rev.1", f"https://imorules.com/ship/CIRC_MEPC_1_884_Rev_1.html"))
              targets.append((f"MSC.1_Circ.{i}", f"https://imorules.com/ship/CIRC_MSC_1_{i}.html"))

          # Remove duplicates, keep 1200 combos
          targets = list(dict.fromkeys(targets))[:1500]
          print(f"Total circular URLs to try: {len(targets)}")

          def make_pdf(name, text, url):
              safe = name.replace("/","_") + ".pdf"
              if os.path.exists(f"imo_pdfs/{safe}"):
                  return f"Skip {safe}"
              pdf = FPDF()
              pdf.set_auto_page_break(auto=True, margin=15)
              pdf.set_font("Helvetica", size=9)
              pdf.add_page()
              header = f"SOURCE: {safe} | Page 1 | URL: {url}"
              full = header + "\n\n" + text[:12000]
              safe_txt = full.encode('latin-1','ignore').decode('latin-1')
              pdf.multi_cell(0,4.5,safe_txt)
              pdf.output(f"imo_pdfs/{safe}")
              return f"OK {safe} {len(text)} chars"

          def fetch_one(item):
              name, url = item
              try:
                  r = s.get(url, timeout=15)
                  if r.status_code!=200 or len(r.text)<500:
                      return f"Fail {name}"
                  soup = BeautifulSoup(r.text, 'html.parser')
                  txt = soup.get_text(separator="\n")
                  if len(txt)<300 or "404" in txt[:200]:
                      return f"Fail short {name}"
                  return make_pdf(name, txt, url)
              except Exception as e:
                  return f"Error {name} {e}"

          ok=0
          print("Starting 5 workers for circulars...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              for res in ex.map(fetch_one, targets):
                  print(res)
                  if res.startswith("OK"):
                      ok+=1
                      if ok % 20 == 0:
                          print(f"--- Total circular PDFs so far: {ok} ---")

          print(f"\nFINAL Circulars Downloaded: {ok}")
          print(f"Total PDFs in imo_pdfs: {len(os.listdir('imo_pdfs'))}")
          PY

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "Add MEPC.1/Circ circulars 1-1000 - 5 workers" || true
          git push
