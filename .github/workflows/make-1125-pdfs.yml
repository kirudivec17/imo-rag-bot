name: Rebuild 1125 PDFs - 5 Workers

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete only bad PDFs - Keep 13 master parts safe
        run: |
          rm -rf imo_pdfs
          mkdir -p imo_pdfs
          echo "Old IMO_DOC PDFs deleted"
          echo "13 master parts safe - not deleted"
          ls master_imo_all_public_part*.txt | wc -l

  build:
    needs: clean
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install all dependencies - FIXED
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pypdf faiss-cpu openai tiktoken
          fi
          # numpy ke liye extra sure
          pip install numpy

      - name: Run worker ${{ matrix.worker_id }}
        run: |
          python imo-rag-bot/ingest.py --worker-id ${{ matrix.worker_id }} --workers 5 || python ingest.py --worker-id ${{ matrix.worker_id }} --workers 5 || python ingest.py

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ matrix.worker_id }}
          path: imo_pdfs/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: imo_pdfs/
          merge-multiple: true
      - name: Commit final PDFs
        run: |
          ls imo_pdfs | wc -l
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add imo_pdfs/
          git commit -m "Final 1125 PDFs - 5 workers - full page no gap" || echo "no changes"
          git push
