name: V8 Final - Circulars 800-1700 - 50 Real Target

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v8:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests --quiet
      - name: V8 Circulars Brute
        run: |
          python3 << 'PY'
          import os, re, time, requests
          from urllib.parse import unquote

          os.makedirs("imo_pdfs", exist_ok=True)
          before = len([f for f in os.listdir("imo_pdfs") if os.path.getsize(os.path.join("imo_pdfs",f))>12000])
          print(f"Before: {before} REAL")

          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.imo.org/"})

          base = "https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/Documents/"
          urls=[]

          # Ye range tumne kabhi nahi kiya - yahi se 50 ayega
          for i in range(790, 1020):  # MEPC 790-1020
              for fmt in [f"MEPC.1-Circ.{i}.pdf", f"MEPC.1-CIRC.{i}.pdf", f"MEPC.1-Circ.{i}-Rev.1.pdf", f"MEPC.1-Circ.{i}-Rev.2.pdf"]:
                  urls.append(base+fmt)
          for i in range(1300, 1720): # MSC 1300-1720 - bahut saare naye hain
              for fmt in [f"MSC.1-Circ.{i}.pdf", f"MSC.1-CIRC.{i}.pdf", f"MSC.1-Circ.{i}-Rev.1.pdf"]:
                  urls.append(base+fmt)
          for i in range(400, 500): # BWM circulars
              urls.append(base+f"BWM.2-Circ.{i}.pdf")
              urls.append(base+f"BWM.2-CIRC.{i}.pdf")

          print(f"Total to try: {len(urls)}")

          def dl(url):
              # filename alag, url alag
              raw_name = url.split("/")[-1]
              fn = unquote(raw_name)  # %20 -> space
              fn = re.sub(r'[^A-Za-z0-9._() -]', '_', fn)  # ab safe
              if not fn.lower().endswith(".pdf"):
                  fn+=".pdf"
              path = f"imo_pdfs/{fn}"
              if os.path.exists(path) and os.path.getsize(path)>12000:
                  return "SKIP"
              try:
                  r=session.get(url, timeout=20)
                  if r.status_code==200 and len(r.content)>12000 and b"%PDF" in r.content[:4000]:
                      open(path,"wb").write(r.content)
                      return f"REAL OK {fn} {len(r.content)//1024}KB"
                  if r.status_code==200 and len(r.content)<12000:
                      return f"SMALL {len(r.content)}B {fn}"
              except:
                  time.sleep(0.3)
                  pass
              return "FAIL"

          ok=0
          # Slow - 3 workers only taaki block na ho
          from concurrent.futures import ThreadPoolExecutor
          import time as tm
          with ThreadPoolExecutor(max_workers=3) as ex:
              for idx, msg in enumerate(ex.map(dl, urls)):
                  if "REAL OK" in msg:
                      ok+=1
                      print(msg)
                      if ok>=60:
                          print("60 mil gaya, stop")
                          break
                  if idx%100==0:
                      print(f"Checked {idx}/{len(urls)} found {ok}")
                      tm.sleep(1)

          after = len([f for f in os.listdir("imo_pdfs") if os.path.getsize(os.path.join("imo_pdfs",f))>12000])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after} REAL")
          print(f"New Added: {after-before}")
          print(f"Success: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V8 circulars 790-1720 - target 50" || true
          git push
