name: IMO SEARCH API - All 3 Queries Combined

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combined-search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml --quiet

      - name: Crawl 3 Search APIs from your links
        run: |
          python - << 'PY'
          import requests, os, re, time
          from urllib.parse import urljoin, quote
          from concurrent.futures import ThreadPoolExecutor

          os.makedirs("imo_pdfs", exist_ok=True)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0)",
              "Accept": "text/html,application/xhtml+xml",
              "Referer": "https://www.imo.org/en/OurWork/Pages/Default.aspx"
          })

          # Tumhare 3 links ka base - token hata ke
          queries = [
              "pdf", 
              "all pdf files",
              "assembly",
              "IMDG Code",
              "IMO Vega",
              "MEPC resolution",
              "MSC resolution",
              "List of certificates",
              "carriage of publications"
          ]

          all_links = set()

          for q in queries:
              for page in [1,2,3]: # 3 pages each
                  try:
                      # Try both formats
                      urls = [
                          f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}&page={page}",
                          f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}",
                      ]
                      for s_url in urls:
                          print(f"\nSearch q='{q}' page {page}: {s_url[:80]}")
                          r = session.get(s_url, timeout=30)
                          if r.status_code != 200:
                              continue
                          text = r.text
                          # Extract PDFs
                          found = re.findall(r'https://wwwcdn\.imo\.org[^\s"\'<>]+\.pdf', text, re.IGNORECASE)
                          found += [urljoin("https://www.imo.org", u) for u in re.findall(r'/localresources/[^\s"\'<>]+\.pdf', text, re.IGNORECASE)]
                          found += [urljoin("https://www.imo.org", u) for u in re.findall(r'/KnowledgeCentre/[^\s"\'<>]+\.pdf', text, re.IGNORECASE)]
                          found += [urljoin("https://www.imo.org", u) for u in re.findall(r'/OurWork/[^\s"\'<>]+\.pdf', text, re.IGNORECASE)]
                          
                          if found:
                              print(f"  -> {len(found)} PDFs")
                              for f in found[:3]:
                                  print(f"     {f[:80]}")
                              all_links.update(found)
                          time.sleep(0.8)
                      if len(all_links) > 200:
                          break
                  except Exception as e:
                      print(f"Err {q}: {e}")

          print(f"\nTOTAL UNIQUE PDF LINKS: {len(all_links)}")
          
          # Save list for debug
          open("pdf_list.txt","w").write("\n".join(list(all_links)[:500]))

          def dl(url):
              try:
                  url = url.replace(" ", "%20")
                  fname = url.split("/")[-1].split("?")[0]
                  fname = re.sub(r'[^A-Za-z0-9._()-]', '_', fname)
                  if len(fname) < 5 or len(fname) > 130:
                      fname = f"imo_{abs(hash(url)) % 1000000}.pdf"
                  if not fname.lower().endswith(".pdf"):
                      fname += ".pdf"
                  path = f"imo_pdfs/{fname}"
                  if os.path.exists(path) and os.path.getsize(path) > 15000:
                      return f"SKIP {fname}"

                  resp = session.get(url, timeout=40, stream=True)
                  if resp.status_code == 200:
                      data = resp.content
                      if len(data) > 10000 and (b"%PDF" in data[:1000] or len(data) > 40000):
                          open(path, "wb").write(data)
                          return f"REAL OK {fname} {len(data)//1024}KB"
                  return f"FAIL {url[:60]} {resp.status_code}"
              except Exception as e:
                  return f"ERR {e} {url[:50]}"

          print("\nDownloading REAL PDFs...")
          with ThreadPoolExecutor(max_workers=12) as ex:
              for msg in ex.map(dl, list(all_links)):
                  print(msg)

          final = len([f for f in os.listdir("imo_pdfs") if f.endswith(".pdf")])
          print(f"\nFINAL COUNT: {final} REAL PDFs (started from 245)")
          PY

      - name: Push to GitHub
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ pdf_list.txt || true
          git commit -m "From user search links - q=pdf + all pdf files + assembly + IMDG + Vega - combined crawler" || true
          git push
