name: V9 Working - Search Method - 50 Target

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v9:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml --quiet
      - name: V9 Search - Real Working
        run: |
          python3 << 'PY'
          import os, re, time, requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote, urljoin, unquote

          os.makedirs("imo_pdfs", exist_ok=True)
          # cleanup fake <12KB
          for f in os.listdir("imo_pdfs"):
              fp=os.path.join("imo_pdfs",f)
              try:
                  if os.path.getsize(fp)<12000:
                      os.remove(fp)
              except: pass
          before=len([f for f in os.listdir("imo_pdfs") if f.lower().endswith(".pdf")])
          print(f"Before cleanup: {before}")

          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://www.imo.org/"})

          # V2 wale hi queries jo WORK kiye the + 80 naye
          queries=[
              "pdf","all pdf files","assembly","MEPC resolution","MSC resolution","circular","guidelines",
              "SOLAS","MARPOL","ISM Code","ISPS Code","LSA Code","FSS Code","IMDG Code","IBC Code","IGC Code",
              "MARPOL Annex I","MARPOL Annex II","MARPOL Annex IV","MARPOL Annex V","MARPOL Annex VI",
              "BWM Convention","GHG strategy","EEDI","SEEMP","CII","EEXI","EEXI calculation","SEEMP Part III",
              "DCS","CII guidelines","Ballast Water","Anti-fouling","Air Pollution","NOx","SOx","EGCS","Scrubber",
              "Carbon Intensity","Energy Efficiency","Fuel Consumption","Ship Recycling","Hong Kong Convention",
              "Load Lines","Tonnage","COLREG","STCW","STCW-F","SAR","GMDSS","Polar Code","IGF Code","ESD",
              "Fire Safety","Life Saving","Carriage of Cargoes","Dangerous Goods","Solid Bulk Cargoes","Grain Code",
              "INF Code","OSV Code","MODU Code","Noise Code","Intact Stability","Subdivision","Damage Stability",
              "Tanker Safety","Bulk Carrier Safety","Container Safety","Fishing Vessel Safety","Passenger Ship Safety",
              "High Speed Craft","WIG Craft","MASS Code","Autonomous Ships","Cyber Security","Fuel Oil Safety",
              "List of certificates","carriage of publications","IMO Vega","IMSBC Code","IMDG Code Supplement"
          ]

          all_urls=set()
          for q in queries:
              for search_url in [
                  f"https://www.imo.org/en/googlesearch/searchposts/default.aspx?q={quote(q)}",
                  f"https://www.imo.org/en/MediaCentre/Search/Pages/Search.aspx?k={quote(q)}"
              ]:
                  try:
                      r=session.get(search_url, timeout=25)
                      if r.status_code!=200: continue
                      # 2 tarah se PDF nikalo
                      pdfs=re.findall(r'https://wwwcdn\.imo\.org[^\s"\'<>]+\.pdf', r.text, re.I)
                      pdfs+=re.findall(r'https://www\.imo\.org[^\s"\'<>]+\.pdf', r.text, re.I)
                      pdfs+=re.findall(r'/localresources/[^\s"\'<>]+\.pdf', r.text, re.I)
                      for u in pdfs:
                          if u.startswith("/"): u="https://www.imo.org"+u
                          u=u.replace(" ","%20").split('"')[0].split("'")[0]
                          if ".pdf" in u.lower():
                              all_urls.add(u)
                      if pdfs:
                          print(f"Q={q[:20]} -> {len(pdfs)}")
                  except Exception as e:
                      pass
                  time.sleep(0.3)

          # Plus old Annex VI index jo 100% work karta tha
          annex_pages=[
              "https://www.imo.org/en/ourwork/environment/pages/index-of-mepc-resolutions-and-guidelines-related-to-marpol-annex-vi.aspx",
              "https://www.imo.org/en/ourwork/environment/pages/index-of-mepc-resolutions-and-guidelines-related-to-marpol-annex-vi-2.aspx",
              "https://www.imo.org/en/ourwork/environment/pages/index-of-mepc-resolutions-and-guidelines-related-to-marpol-annex-vi-3.aspx",
              "https://www.imo.org/en/ourwork/environment/pages/index-of-mepc-resolutions-and-guidelines-related-to-marpol-annex-vi-4.aspx",
          ]
          for pg in annex_pages:
              try:
                  r=session.get(pg,timeout=25)
                  if r.status_code!=200: continue
                  soup=BeautifulSoup(r.text,"lxml")
                  cnt=0
                  for a in soup.find_all("a", href=True):
                      h=a["href"]
                      if ".pdf" in h.lower():
                          full=urljoin(pg,h)
                          if "/localresources/" in full and "wwwcdn" not in full:
                              full=full.replace("https://www.imo.org","https://wwwcdn.imo.org")
                          all_urls.add(full)
                          cnt+=1
                  print(f"Annex {pg[-10:]} -> {cnt}")
              except: pass

          print(f"\nTotal unique PDFs found: {len(all_urls)}")

          def dl(url):
              try:
                  raw=url.split("/")[-1].split("?")[0].split("#")[0]
                  raw=unquote(raw)
                  fn=re.sub(r'[^A-Za-z0-9._() -]','_',raw)
                  if len(fn)<5: fn=f"IMO_{abs(hash(url))%100000}.pdf"
                  if not fn.lower().endswith(".pdf"): fn+=".pdf"
                  path=f"imo_pdfs/{fn}"
                  if os.path.exists(path) and os.path.getsize(path)>12000:
                      return "SKIP"
                  r=session.get(url,timeout=30)
                  if r.status_code==200 and len(r.content)>12000 and b"%PDF" in r.content[:5000]:
                      open(path,"wb").write(r.content)
                      return f"REAL OK {fn} {len(r.content)//1024}KB"
              except:
                  pass
              return "FAIL"

          ok=0
          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=8) as ex:
              for m in ex.map(dl, list(all_urls)):
                  if "REAL OK" in m:
                      ok+=1
                      print(m)

          after=len([f for f in os.listdir("imo_pdfs") if os.path.getsize(os.path.join("imo_pdfs",f))>12000])
          print(f"\n=== FINAL ===")
          print(f"Before: {before}")
          print(f"Now: {after}")
          print(f"New Added: {after-before}")
          print(f"Success: {ok}")
          PY
      - name: Push
        run: |
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/
          git commit -m "V9 search method - 80 queries - real working" || true
          git push
