name: IMO FULL SITE - REAL Everything Crawler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-imo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml PyMuPDF --quiet

      - name: Crawl Full IMO Site - REAL PDFs
        run: |
          python - << 'PY'
          import requests, os, re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor
          
          os.makedirs("imo_pdfs", exist_ok=True)
          os.makedirs("imo_chunks", exist_ok=True)
          
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (Real IMO Crawler)"})
          
          # All important IMO sections from your screenshots
          seed_urls = [
            "https://www.imo.org/en/OurWork/Environment/Pages/Index-of-MEPC-Resolutions-and-Guidelines-related-to-MARPOL-Annex-VI.aspx",
            "https://www.imo.org/en/OurWork/Environment/Pages/Index-of-MEPC-Resolutions-and-Guidelines-related-to-MARPOL-Annex-VI-2.aspx", # Amendments
            "https://www.imo.org/en/OurWork/Environment/Pages/Index-of-MEPC-Resolutions-and-Guidelines-related-to-MARPOL-Annex-VI-3.aspx", # Unified Interpretations
            "https://www.imo.org/en/OurWork/Environment/Pages/Index-of-MEPC-Resolutions-and-Guidelines-related-to-MARPOL-Annex-VI-4.aspx", # Air Pollution
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/Default.aspx",
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/MEPC.aspx",
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/MSC.aspx",
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/PPR.aspx",
            "https://www.imo.org/en/MediaCentre/MeetingSummaries/Pages/III.aspx",
            "https://www.imo.org/en/OurWork/Publications/Pages/Default.aspx",
            "https://www.imo.org/en/OurWork/Safety/Pages/IMDG-Code.aspx",
            "https://www.imo.org/en/OurWork/Safety/Pages/IMO-Vega.aspx",
          ]
          
          found_pdfs = set()
          
          def crawl_page(url):
              try:
                  r = session.get(url, timeout=20)
                  if r.status_code != 200:
                      return []
                  soup = BeautifulSoup(r.text, "lxml")
                  pdfs = []
                  for a in soup.find_all("a", href=True):
                      href = a["href"]
                      if ".pdf" in href.lower():
                          full = urljoin(url, href)
                          # Only IMO domain
                          if "imo.org" in full:
                              pdfs.append(full)
                  # Also find sub-pages to crawl deeper (max 2 level)
                  links = []
                  for a in soup.find_all("a", href=True):
                      href = a["href"]
                      full = urljoin(url, href)
                      if "imo.org/en/OurWork" in full or "imo.org/en/MediaCentre" in full:
                          if full not in seed_urls:
                              links.append(full)
                  return pdfs, links[:5]
              except Exception as e:
                  print(f"Fail crawl {url}: {e}")
                  return [], []
          
          all_pdfs = []
          to_visit = seed_urls[:]
          visited = set()
          
          # BFS crawl 2 levels deep
          for _ in range(2):
              next_visit = []
              with ThreadPoolExecutor(max_workers=5) as ex:
                  results = list(ex.map(crawl_page, to_visit))
              for pdfs, links in results:
                  all_pdfs.extend(pdfs)
                  next_visit.extend(links)
              visited.update(to_visit)
              to_visit = [u for u in next_visit if u not in visited][:20]
              print(f"Level {_} - Found {len(all_pdfs)} PDF links so far, next pages {len(to_visit)}")
          
          all_pdfs = list(set(all_pdfs))
          print(f"\nTOTAL PDF LINKS FOUND: {len(all_pdfs)}")
          for p in all_pdfs[:20]:
              print(f"  {p}")
          
          # Now download REAL PDFs
          def download_pdf(pdf_url):
              try:
                  # Safe filename
                  fname = pdf_url.split("/")[-1].split("?")[0]
                  fname = re.sub(r'[^A-Za-z0-9._-]', '_', fname)
                  if not fname.lower().endswith(".pdf"):
                      fname += ".pdf"
                  path = f"imo_pdfs/{fname}"
                  if os.path.exists(path) and os.path.getsize(path) > 20000:
                      return f"SKIP {fname}"
                  
                  r = session.get(pdf_url, timeout=30, stream=True)
                  if r.status_code == 200:
                      content = r.content
                      if len(content) > 10000 and content[:4] == b'%PDF':
                          open(path, "wb").write(content)
                          return f"REAL OK {fname} {len(content)//1024}KB"
                  return f"FAIL {pdf_url}"
              except Exception as e:
                  return f"ERR {e}"
          
          print("\nDownloading REAL PDFs...")
          with ThreadPoolExecutor(max_workers=8) as ex:
              for res in ex.map(download_pdf, all_pdfs):
                  print(res)
          
          final_count = len([f for f in os.listdir("imo_pdfs") if f.endswith(".pdf")])
          print(f"\nFINAL REAL PDF COUNT: {final_count} (was 245)")
          PY

      - name: Build REAL Chunks + Push
        run: |
          python - << 'PY'
          import os, json, fitz
          os.makedirs("imo_chunks", exist_ok=True)
          pdfs = [f for f in os.listdir("imo_pdfs") if f.endswith(".pdf")]
          total = 0
          for fname in pdfs:
              if os.path.exists(f"imo_chunks/{fname}.json"):
                  continue
              try:
                  doc = fitz.open(f"imo_pdfs/{fname}")
                  chunks = []
                  for i, page in enumerate(doc):
                      txt = page.get_text("text").strip()
                      if len(txt) < 80: continue
                      chunks.append({"source": fname, "page": i+1, "text": f"SOURCE: {fname} | Page {i+1}\n"+txt[:4000], "chunk_id": f"{fname}_p{i+1}"})
                  if chunks:
                      json.dump(chunks, open(f"imo_chunks/{fname}.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
                      total+=len(chunks)
              except: pass
          print(f"Chunks total {total}")
          PY
          git config user.name bot
          git config user.email bot@bot.com
          git pull --rebase origin main || true
          git add -f imo_pdfs/ imo_chunks/
          git commit -m "IMO FULL REAL CRAWL - MEPC Annex VI, MEPC/MSC/PPR Meetings, IMDG, Vega, Publications" || true
          git push
