name: Rebuild 1125 PDFs - 5 Workers

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf imo_pdfs
          mkdir -p imo_pdfs

  build:
    needs: clean
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f imo-rag-bot/requirements.txt ]; then pip install -r imo-rag-bot/requirements.txt; fi
          pip install numpy tqdm pypdf google-genai

      - name: Run worker ${{ matrix.worker_id }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python imo-rag-bot/ingest.py --worker-id ${{ matrix.worker_id }} --workers 5 || python ingest.py --worker-id ${{ matrix.worker_id }} --workers 5

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ matrix.worker_id }}
          path: imo_pdfs/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: imo_pdfs/
          merge-multiple: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add imo_pdfs/
          git commit -m "Final 1125 PDFs - 5 workers" || true
          git push
