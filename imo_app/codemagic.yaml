workflows:
  android-workflow:
    name: IMO App APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd imo_app && flutter pub get
      - name: Build APK
        script: |
          cd imo_app && flutter build apk --release
    artifacts:
      - imo_app/build/app/outputs/flutter-apk/app-release.apk
