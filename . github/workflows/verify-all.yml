name: Verify All PDFs
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Count Local PDFs
        run: |
          echo "=== LOCAL imo_pdfs ==="
          find imo_pdfs -name "*.pdf" | wc -l
          echo "=== LOCAL imo_pdfs_2 ==="
          find imo_pdfs_2 -name "*.pdf" | wc -l
          echo "=== LOCAL imo_pdfs_3 ==="
          find imo_pdfs_3 -name "*.pdf" | wc -l
          echo "=== LOCAL TOTAL ==="
          find imo_pdfs imo_pdfs_2 imo_pdfs_3 -name "*.pdf" | wc -l
          echo "=== LOCAL LIST ==="
          find imo_pdfs imo_pdfs_2 imo_pdfs_3 -name "*.pdf" | sort > /tmp/local.txt
          cat /tmp/local.txt | wc -l
      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Setup OCI Config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
      - name: Compare Bucket vs Local
        run: |
          oci os object list -ns ${{ secrets.OCI_NAMESPACE }} -bn ${{ secrets.OCI_BUCKET }} --all > /tmp/bucket.json
          cat /tmp/bucket.json | grep '"name"' | cut -d '"' -f 4 | sort > /tmp/bucket.txt
          echo "=== BUCKET TOTAL ==="
          cat /tmp/bucket.txt | wc -l
          echo "=== MISSING IN BUCKET (Local me hai, Bucket me nahi) ==="
          comm -23 /tmp/local.txt /tmp/bucket.txt
          echo "=== EXTRA IN BUCKET ==="
          comm -13 /tmp/local.txt /tmp/bucket.txt
